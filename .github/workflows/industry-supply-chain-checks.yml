name: Supply-chain research unit checks
on:
  pull_request:
    paths:
      - 'research/industry_supply_chain/**'
      - '.github/workflows/industry-supply-chain-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/industry_supply_chain/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and SEC accounting invariants
        run: |
          python -m py_compile research/industry_supply_chain/ledger.py research/industry_supply_chain/sec_capex.py research/industry_supply_chain/test_ledger.py
          python -m unittest discover -s research/industry_supply_chain -p 'test_ledger.py' -v
