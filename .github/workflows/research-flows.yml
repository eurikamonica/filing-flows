# Money flows for the RRG (Rotation → RRG: the flow arrows, the money-flow quadrants and their guide; docs/rrg-flow.js).
# Every trading day after FINRA's evening file and research-paths' daily bars: FINRA's daily short sale volume of
# off-exchange trades (the consolidated file on cdn.finra.org, from 2018-08-01; each day fetched once, the first runs fill
# the history) added up by week in cache/finra/, then public/ rebuilt by app/flows.py from it and research-paths' daily
# bars: each ticker's weekly big-money net buying (the off-exchange short share against its own last 52 weeks) and net
# money inflow (Chaikin's money flow), and what followed each quadrant. An experiment beside them (app/perps.py): the
# taker buy and sell on OKX's and Bitget's perpetual futures of the same stocks, kept a day at a time. Kept on the branch
# "research-flows" (one commit, force-pushed); scan.yml publishes public/ at disclosures/data/research/flows/.
name: Research — money flows
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes for FINRA downloads (the first runs fill the history from August 2018)'
        default: '25'
  schedule:
    - cron: '35 4 * * 2-6'          # Tuesday–Saturday 04:35 UTC: after FINRA's evening file and research-paths' bars
permissions:
  contents: write
concurrency:
  group: research-flows
  cancel-in-progress: false
jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: |
            /disclosures/app/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy
      - name: The data branch and research-paths' daily bars
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" research-flows >/dev/null; then
            git clone --quiet --depth 1 --branch research-flows "$url" flw
          else
            mkdir flw && git -C flw init --quiet -b research-flows && git -C flw remote add origin "$url"
          fi
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch research-paths "$url" _paths
          git -C _paths sparse-checkout set --no-cone /cache/ohlc/
          ls _paths/cache/ohlc | wc -l
          du -sh flw _paths/cache/ohlc
      - name: FINRA's daily short sale volume (cache/finra/, each day once)
        timeout-minutes: 35
        run: python disclosures/app/flows.py collect --root flw --minutes "${{ inputs.minutes || '25' }}"
      - name: Crypto exchanges' stock perpetuals (OKX, Bitget) — an experiment, its failures stop nothing
        continue-on-error: true
        timeout-minutes: 15
        run: python disclosures/app/perps.py collect --root flw --bars _paths/cache/ohlc
      - name: Build public/ (t/<TICKER>.json, index.json)
        timeout-minutes: 15
        run: python disclosures/app/flows.py build --root flw --bars _paths/cache/ohlc
      - name: Save to the branch (one commit, force-pushed)
        if: always()
        run: |
          cd flw
          [ -d cache ] || exit 0
          printf '%s\n' '# research-flows (data only)' '' "FINRA's daily short sale volume added up by week (cache/finra/) and the files the site" \
            'publishes (public/: each ticker'"'"'s weekly big-money net buying and net money inflow), kept by' \
            '.github/workflows/research-flows.yml on main. Force-pushed as a single commit.' > README.md
          git add -A
          git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" commit -q -m "flows $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git checkout -q --orphan fresh
          git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" commit -q -m "flows $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q --force origin fresh:research-flows && break; sleep $((i * 10)); done
          [ -f public/status.json ] && cat public/status.json || cat cache/finra/state.json | head -20
