# Example config. Do NOT put API keys here: the loader rejects credential-like keys.
# Testnet keys come from env vars <EXCHANGE>_TESTNET_API_KEY / <EXCHANGE>_TESTNET_API_SECRET.
#
# mode: backtest | paper | testnet   (live trading is not supported)
mode: backtest
exchange: binanceusdm          # any ccxt exchange id with swap markets
backtest_steps: 20000

# Symbols use ccxt unified notation BASE/QUOTE:SETTLE. Commodity and stock perps
# differ by exchange and change often; check what exists with:
#   python -m hft.cli markets --exchange binanceusdm --base XAU TSLA
# and copy tick/lot/fees from that output before running paper or testnet.
instruments:
  - symbol: BTC/USDT:USDT
    asset_class: crypto
    tick_size: 0.1
    lot_size: 0.001
    start_price: 100000        # only used by the synthetic backtest feed
    strategy: market_maker
    params: {order_qty: 0.001, gamma: 0.1, min_spread_ticks: 2, max_inventory: 0.005}

  - symbol: XAU/USDT:USDT      # gold perp
    asset_class: commodity
    tick_size: 0.01
    lot_size: 0.001
    start_price: 2600
    strategy: market_maker
    params: {order_qty: 0.02, gamma: 0.1, min_spread_ticks: 2, max_inventory: 0.1}

  - symbol: TSLA/USDT:USDT     # stock perp; verify availability on your exchange
    asset_class: equity
    tick_size: 0.01
    lot_size: 0.01
    start_price: 250
    strategy: imbalance
    params: {order_qty: 0.1, threshold: 0.6, take_profit_ticks: 5, stop_loss_ticks: 5, max_hold: 10}

risk:
  max_position_notional: 1000
  max_gross_notional: 3000
  max_order_notional: 200
  max_orders_per_sec: 20
  max_drawdown: 100
  max_price_deviation: 0.01
