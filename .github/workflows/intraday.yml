# Move odds, intraday (the hub's Move odds → Market & sectors, live): every five minutes through the US session, each
# asset's move so far today against its own history at the same time of day, and what followed — to the close and over
# the next days, and the price against its VWAP (app/intraday.py). A relay: one run scans for about 50 minutes, then
# starts the next while the session is open. GitHub's clock starts few of the schedules (none on the first day), so the
# X-post watch relay starts it: post-to-x.yml runs around the clock, and its owner lane (pipeline/owner_lane.py) starts
# this workflow from 9:10 New York whenever no run of it is running or waiting; the cron below is a last resort. live.json is force-pushed to the branch intraday-live as one commit each scan; the hub reads it from
# raw.githubusercontent.com. The hourly history (h60/) stays in the Actions cache, a key a day. Repository variable
# INTRADAY_RELAY=off stops it.
name: Intraday move odds (relay)
on:
  schedule:
    - cron: '7,27,47 13-21 * * 1-5'   # 8:07–16:47 New York in winter, 9:07–17:47 in summer (off the top of the hour, when GitHub's clock lags): a restart for the relay
  workflow_dispatch:
    inputs:
      hop:
        description: "Relay hop (stops after 12)"
        required: false
        default: '0'
      once:
        description: "One scan now, open or not (a check: no relay)"
        type: boolean
        default: false
permissions:
  contents: write      # push the branch intraday-live
  actions: write       # start the next hop
concurrency:
  group: intraday-relay
  cancel-in-progress: false
jobs:
  scan:
    if: vars.INTRADAY_RELAY != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            disclosures/app
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Is the session open?
        id: open
        run: |
          python -m pip install --quiet numpy
          echo "day=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.once }}" = "true" ]; then echo "open=1" >> "$GITHUB_OUTPUT"; echo "one scan, open or not"
          elif python disclosures/app/intraday.py --session; then echo "open=1" >> "$GITHUB_OUTPUT"
          else echo "open=0" >> "$GITHUB_OUTPUT"; echo "the US session is closed: nothing to scan"; fi
      - name: The hourly history (the Actions cache)
        id: hist
        if: steps.open.outputs.open == '1'
        uses: actions/cache/restore@v4
        with:
          path: h60
          key: intraday-h60-${{ steps.open.outputs.day }}
          restore-keys: intraday-h60-
      - name: Scan every five minutes for about 50 minutes
        if: steps.open.outputs.open == '1'
        timeout-minutes: 56
        env:
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          mkdir -p live
          publish() {                                                # one commit with live.json alone, force-pushed
            ( cd live
              rm -rf .git
              printf '%s\n' '# intraday-live (data only)' '' 'live.json of the hub'\''s intraday move odds, force-pushed as one commit every scan' \
                'by .github/workflows/intraday.yml (app/intraday.py).' > README.md
              git init -q -b intraday-live && git remote add origin "$PUSH_URL" && git add -A
              git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" commit -q -m "intraday $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do git push -q --force origin intraday-live && break; sleep $((i * 5)); done )
          }
          end=$((SECONDS + 50 * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            t0=$SECONDS
            python disclosures/app/intraday.py --out live --cache h60 || echo "::warning::scan failed (the next one tries again)"
            [ -f live/live.json ] && publish
            [ "${{ inputs.once }}" = "true" ] && { echo "one scan: done"; break; }
            python disclosures/app/intraday.py --session || { echo "the session has closed: the last scan is published"; break; }
            wait=$((300 - (SECONDS - t0))); [ "$wait" -gt 0 ] && sleep "$wait"
          done
      - name: The hourly history, saved once a day
        if: always() && steps.open.outputs.open == '1' && steps.hist.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: h60
          key: intraday-h60-${{ steps.open.outputs.day }}
      - name: The next hop (a relay)
        if: steps.open.outputs.open == '1' && github.ref == 'refs/heads/main' && inputs.once != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOP: ${{ github.event.inputs.hop || '0' }}
        run: |
          if [ "$HOP" -ge 12 ]; then echo "relay cap (12 hops) reached; the schedule restarts it"; exit 0; fi
          if ! python disclosures/app/intraday.py --session; then echo "the session is over: no next hop"; exit 0; fi
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow intraday.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting")] | length')
          if [ "${n:-0}" -gt 0 ]; then echo "a run is already waiting: it carries on"; exit 0; fi
          gh workflow run intraday.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f hop=$((HOP + 1)) && echo "hop $((HOP + 1)) started"
