name: Prediction Market Intelligence checks
on:
  pull_request:
    paths:
      - 'research/prediction_market_intel.py'
      - 'research/test_prediction_market_intel.py'
      - 'disclosures/docs/consensus.js'
      - '.github/workflows/prediction-market-intel-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/prediction_market_intel.py
            /research/test_prediction_market_intel.py
            /disclosures/docs/consensus.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research -p 'test_prediction_market_intel.py' -v
      - run: node --check disclosures/docs/consensus.js
