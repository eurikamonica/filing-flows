name: AI Capital Flow Research
on:
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * 0'
permissions:
  contents: write
concurrency:
  group: ai-capital-flow-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Test model invariants
        run: python -m unittest disclosures.tests.test_ai_capital_flow -v
      - name: Fetch SEC actuals and generate scenario
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          test -n "$SEC_USER_AGENT" || { echo 'Configure SEC_USER_AGENT secret'; exit 1; }
          python -m disclosures.app.ai_capital_flow --year 2027 --output disclosures/docs/data/ai-capital-flow.json
      - name: Commit research JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f disclosures/docs/data/ai-capital-flow.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update AI capital-flow research scenario'
            git push
          fi
