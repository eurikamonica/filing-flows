name: AI Capital Flow Research
on:
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * 0'
permissions:
  contents: write
concurrency:
  group: ai-capital-flow-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:                      # the code and the one data file it writes, not the hub's 90,000 data files
          filter: blob:none
          sparse-checkout: |
            /pipeline/
            /disclosures/app/
            /disclosures/tests/
            /disclosures/docs/data/ai-capital-flow.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Test model invariants
        run: python -m unittest disclosures.tests.test_ai_capital_flow -v
      - name: Fetch SEC actuals and generate scenario
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          test -n "$SEC_USER_AGENT" || { echo 'Configure SEC_USER_AGENT secret'; exit 1; }
          python -m disclosures.app.ai_capital_flow --year 2027 --output disclosures/docs/data/ai-capital-flow.json
      - name: Commit research JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f disclosures/docs/data/ai-capital-flow.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -qm 'data: update AI capital-flow research scenario'
          for attempt in 1 2 3 4; do           # main moves every few minutes (data commits): replay and retry
            git fetch -q origin main
            if git rebase -q origin/main && git push -q origin HEAD:main; then echo "Pushed on attempt $attempt"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "::error::Could not push the research JSON after 4 attempts"; exit 1
