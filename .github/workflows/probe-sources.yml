# Temporary: fetches a few raw samples (EDGAR 13D/13G/144 filings, FINRA short interest, Senate eFD) to the branch
# "probe-data" so the parsers can be written against real files. Removed once the collectors are in.
name: Probe new data sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch samples
        shell: python
        run: |
          import json, os, re, time, requests
          os.makedirs('out', exist_ok=True)
          ua = os.environ['SEC_USER_AGENT']
          s = requests.Session(); s.headers['User-Agent'] = ua
          def save(name, data):
              mode = 'wb' if isinstance(data, bytes) else 'w'
              with open('out/' + name, mode) as f: f.write(data)
          log = []
          for t in []:
              u = 'https://www.sec.gov/cgi-bin/browse-edgar'
              r = s.get(u, params={'action': 'getcurrent', 'type': t, 'company': '', 'dateb': '', 'owner': 'include', 'start': 0, 'count': 40, 'output': 'atom'}, timeout=40)
              save(f'feed-{t.replace(" ", "_")}.xml', r.content); log.append([t, r.status_code, len(r.content)])
              links = re.findall(r'/Archives/edgar/data/(\d+)/(\d{18})/(\d{10}-\d{2}-\d{6})-index\.htm', r.text)
              forms = re.findall(r'<category[^>]*term="([^"]+)"', r.text)
              log.append([t, 'forms', sorted(set(forms))[:12], 'links', len(links)])
              done = set()
              for cik, folder, acc in links:
                  if acc in done or len(done) >= 2: continue
                  done.add(acc); time.sleep(0.3)
                  x = s.get(f'https://www.sec.gov/Archives/edgar/data/{cik}/{folder}/{acc}.txt', timeout=40)
                  save(f'{t.replace(" ", "_")}-{acc}.txt', x.content[:300000]); log.append([acc, x.status_code, len(x.content)])
              time.sleep(0.5)
          # FINRA short interest (second probe: the consolidated dataset, an EQUAL partition filter, Reg SHO files)
          f = requests.Session()
          for ds in ['consolidatedShortInterest', 'equityShortInterest']:
              try:
                  r = f.get(f'https://api.finra.org/partitions/group/otcMarket/name/{ds}', headers={'Accept': 'application/json'}, timeout=60)
                  save(f'finra-partitions-{ds}.json', r.text[:6000]); log.append(['partitions', ds, r.status_code])
                  parts = [p['partitions'][0] for p in (r.json().get('availablePartitions') or [])]
                  latest = max(parts) if parts else None
                  log.append([ds, 'latest partition', latest, 'count', len(parts)])
                  if latest:
                      body = {'limit': 5, 'compareFilters': [{'compareType': 'EQUAL', 'fieldName': 'settlementDate', 'fieldValue': latest}]}
                      q = f.post(f'https://api.finra.org/data/group/otcMarket/name/{ds}', json=body,
                                 headers={'Accept': 'application/json', 'Content-Type': 'application/json'}, timeout=60)
                      save(f'finra-{ds}-latest.json', json.dumps({'status': q.status_code, 'headers': {k: v for k, v in q.headers.items() if k.startswith('record') or k in ('limit', 'offset')}, 'body': q.text[:6000]}, indent=1))
                      log.append([ds, 'data', q.status_code, len(q.content)])
                      body['domainFilters'] = [{'fieldName': 'symbolCode' if ds.startswith('consolidated') else 'issueSymbolIdentifier', 'values': ['AAPL', 'NVDA']}]
                      q = f.post(f'https://api.finra.org/data/group/otcMarket/name/{ds}', json=body,
                                 headers={'Accept': 'application/json', 'Content-Type': 'application/json'}, timeout=60)
                      save(f'finra-{ds}-aapl.json', json.dumps({'status': q.status_code, 'body': q.text[:6000]}, indent=1))
                      log.append([ds, 'symbols', q.status_code, len(q.content)])
              except Exception as e:
                  log.append([ds, 'error', str(e)[:300]])
          for d in ['20261016', '20261015']:
              for u in [f'https://cdn.finra.org/equity/regsho/daily/CNMSshvol{d}.txt']:
                  try:
                      r = f.get(u, timeout=60); save('regsho-' + d + '.txt', r.text[:4000]); log.append([u, r.status_code, len(r.content)])
                  except Exception as e:
                      log.append([u, 'error', str(e)[:200]])
          save('log.json', json.dumps(log, indent=1))
          print(json.dumps(log))
      - name: Save to the branch probe-data
        run: |
          cd out
          git init -q -b probe-data
          git add -A
          git -c user.name=filing-flows -c user.email=actions@users.noreply.github.com commit -qm "probe $(date -u +%FT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:probe-data
