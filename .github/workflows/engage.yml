name: Engagement posts to X

# Question of the day, today's filers, and Reddit trends -> discussion posts for X with the real charts, written by
# GitHub Models from config/engage-guide.md (draft -> polish -> checks) and queued in Buffer (pipeline/engage.py).
#   08:40 ET (before the open): list of the last day's filers + what Reddit is arguing about (reddit_question, reddit_list)
#   17:40 ET (after the close): question of the day from today's filings
# Settings: config/engage.json (cooldowns, hashtags, revenue floor), config/reddit.json (subreddits, hours).
# Optional secrets REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET (free "script" app at reddit.com/prefs/apps) switch Reddit
# reads to the OAuth API; without them the public listing is used (GitHub's IPs are occasionally refused).

on:
  schedule:
    - cron: "40 12 * * 1-5"
    - cron: "40 21 * * 1-5"
    - cron: "30 14 * * 6"                # Saturday 14:30 UTC: the weekly recap thread
  workflow_dispatch:
    inputs:
      kinds:
        description: "Which posts (comma-separated): question, list, reddit_question, reddit_list, mover, explain, peers, insider, calendar, fund13f, weekly"
        type: string
        default: "question,list,reddit_question,reddit_list,insider,calendar,fund13f"
      dry_run:
        description: "Only print the picks and the posts (nothing drawn or queued)"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: engage
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}   # 8-K look-ups
      MEDIA_DIR: media
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL_API_URL: ${{ vars.MODEL_API_URL }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      TWEET_MODEL: ${{ vars.TWEET_MODEL }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:                      # the app only: skip disclosures/ (the hub's multi-GB data), which this job never reads
          sparse-checkout: |
            pipeline
            config
            scripts
            web
            supabase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: What was posted recently (cooldowns)
        run: |
          mkdir -p media/x
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/media/x/engage-state.json" -o media/x/engage-state.json || true
      - name: Pick, write, polish
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          KINDS_INPUT: ${{ inputs.kinds }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          site="${SITE_URL:-https://$owner.github.io/${GITHUB_REPOSITORY#*/}/}"
          kinds="${KINDS_INPUT:-question,list,reddit_question,reddit_list}"
          case "$EVENT_SCHEDULE" in
            '40 12 * * 1-5') kinds=list,reddit_question,reddit_list,insider,fund13f ;;
            '40 21 * * 1-5') kinds=question,insider,calendar,fund13f ;;
            '30 14 * * 6') kinds=weekly ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then
            python -m pipeline.engage --site "$site" --site-url "$site" --kinds "$kinds" --dry-run
          else
            pip install playwright
            python -m playwright install --with-deps chromium
            python -m pipeline.engage --site "$site" --site-url "$site" --kinds "$kinds"
          fi
      - name: Publish the images and queue the posts in Buffer
        if: inputs.dry_run != true
        run: scripts/publish-media.sh
