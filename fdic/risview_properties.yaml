        <div id="swagger-ui"></div>
        <script src="assets/js/swagger-ui-bundle.js"></script>
        <script src="assets/js/swagger-ui-standalone-preset.js"></script>
        <script>
          if (window.location.pathname.endsWith('/docs')) {
            window.location.pathname = window.location.pathname + '/'
          }

          const modal = document.getElementById('leaving-fdic-modal');
          function openModal() {
            modal.classList.add('active');
            overlay.classList.add('active');
          }
          function closeModal() {
            modal.classList.remove('active');
            overlay.classList.remove('active');
          }
          function modalContinue(val) {
            closeModal();
            window.open(val);
          }
          function surveyUrl() {
            return window.open('https://fdicfedramp.gov1.qualtrics.com/jfe/form/SV_cAYHhRaIU5lafb0?Q_LOC=BankFindSuiteWebsite','_blank')
          }

          // Handle navigation on button clicks
          function HandleNavigation(val) {
            const dataDotGovLookup = {
              '/TEST/fdic/banks-d/docs/': 'https://pfabankfindui-d.app.cloud.gov/bankfind-suite',
              '/TEST/fdic/banks-n/docs/': 'https://pfabankfindui-n.app.cloud.gov/bankfind-suite',
              '/TEST/fdic/banks-q/docs/': 'https://pfabankfindui-q.app.cloud.gov/bankfind-suite'
            }
            const bfsUrlLookup = {
              'localhost': 'http://localhost:5000/bankfind-suite',
              'pfabankapi-n.app.cloud.gov':
                'https://pfabankfindui-n.app.cloud.gov/bankfind-suite',
              'pfabankapi-s.app.cloud.gov':
                'https://pfabankfindui-s.app.cloud.gov/bankfind-suite',
              'pfabankapi-q.app.cloud.gov':
                'https://pfabankfindui-q.app.cloud.gov/bankfind-suite',
              'pfabankapi-d.app.cloud.gov':
                'https://pfabankfindui-d.app.cloud.gov/bankfind-suite',
              'pfabankfindui.app.cloud.gov':
                'https://banks.data.fdic.gov/bankfind-suite',
              'banks.data.fdic.gov':
                'https://banks.data.fdic.gov/bankfind-suite',
              'banks-n.data.fdic.gov':
                'https:///pfabankfindui-n.app.cloud.gov/bankfind-suite',
              'banks-s.data.fdic.gov':
                'https:///pfabankfindui-s.app.cloud.gov/bankfind-suite',
              'banks-q.data.fdic.gov':
                'https:///pfabankfindui-q.app.cloud.gov/bankfind-suite',
              'api.fdic.gov': 
                'https://banks.data.fdic.gov/bankfind-suite'
            }

            const pathLookup = {
              'Landing Page': "",
              'Api Home': '/bulkData',
              'Help App': '/help?previousApp=API',
            }

            if(val){
              const url = window.location.hostname === 'api.data.gov' 
                ? `${dataDotGovLookup[window.location.pathname]}${pathLookup[val]}` 
                : `${bfsUrlLookup[window.location.hostname]}${pathLookup[val]}`
              window.location.href = url || `https://banks.data.fdic.gov/bankfind-suite${pathLookup[val]}`
            } else {
              const link = document.getElementById('bfs-breadcrumb-link');
              const url = window.location.hostname === 'api.data.gov' 
                ? dataDotGovLookup[window.location.pathname]
                : bfsUrlLookup[window.location.hostname]
              link.href = url || 'https://banks.data.fdic.gov/bankfind-suite'
            }
          }
          // Sets bfs-breadcrumb-link
          HandleNavigation();

          // swagger.yaml path lookup
          function swaggerYamlPath() {
            const appUrlLookup = {
              '/banks/docs/': '/banks/docs/swagger.yaml',
              '/TEST/fdic/banks-d/docs/': '/TEST/fdic/banks-d/docs/development/swagger.yaml',
              '/TEST/fdic/banks-n/docs/': '/TEST/fdic/banks-n/docs/preview/swagger.yaml',
              '/TEST/fdic/banks-q/docs/': '/TEST/fdic/banks-q/docs/qa/swagger.yaml',
              '/docs/': '/docs/local/swagger.yaml'
            };
              return appUrlLookup[window.location.pathname] ? appUrlLookup[window.location.pathname] : '/banks/docs/swagger.yaml' ;
          }
          
          window.onload = function() {
            // Build a system
            const swaggerURL = swaggerYamlPath()
            const ui = SwaggerUIBundle({
              url: swaggerURL,
              dom_id: '#swagger-ui',
              deepLinking: true,
              validatorUrl: null,
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset,
              ],
              plugins: [SwaggerUIBundle.plugins.DownloadUrl],
              layout: 'StandaloneLayout',
            });

            window.ui = ui;
          };
        </script>
        <!-- END CORE CONTENT -->
