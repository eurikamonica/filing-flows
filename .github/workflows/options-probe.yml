name: Options data probe (temporary)

# One-off check that CBOE's free delayed option-chain JSON still answers from a GitHub runner; results go to the
# run's annotations. Runs once when this file is pushed (and on demand). Delete after the check.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/options-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch AAPL, _SPX and NVDA
        shell: python
        run: |
          import json, urllib.request, time
          for sym in ("AAPL", "_SPX", "NVDA"):
              url = f"https://cdn.cboe.com/api/global/delayed_quotes/options/{sym}.json"
              try:
                  t = time.time()
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (FilingFlows probe)", "Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read()
                      status, ctype = r.status, r.headers.get("content-type")
                  d = json.loads(body)
                  data = d.get("data") or {}
                  opts = data.get("options") or []
                  sample = opts[len(opts) // 2] if opts else {}
                  exps = sorted({o.get("option", "")[len(sym.lstrip("_")):len(sym.lstrip("_")) + 6] for o in opts})
                  print(f"::notice title={sym}::HTTP {status} {ctype} {len(body)//1024} KB in {time.time()-t:.1f}s · timestamp {d.get('timestamp')} · "
                        f"price {data.get('current_price')} · {len(opts)} contracts · {len(exps)} expiries ({exps[:1]}…{exps[-1:]}) · "
                        f"top-level data keys {sorted(data.keys())[:25]}")
                  print(f"::notice title={sym} sample row::{json.dumps(sample)[:900]}")
              except Exception as e:
                  print(f"::error title={sym}::{type(e).__name__}: {str(e)[:300]}")
