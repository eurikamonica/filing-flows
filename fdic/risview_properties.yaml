    <script> async function logMaintenance() {
      const maintenanceLookup = {
        '/TEST/fdic/banks-d/docs/': '/TEST/fdic/banks-d/maintenance' ,
        '/TEST/fdic/banks-n/docs/': '/TEST/fdic/banks-n/maintenance' ,
        '/TEST/fdic/banks-q/docs/': '/TEST/fdic/banks-q/maintenance' ,
        '/banks/docs/': '/banks/maintenance',
        '/docs/': '/api/maintenance'
      };
      const textToLink =(text) => {
        const regex = /\[(.*?)\]/g;
        const parts = text.split(regex);
        const arrayParts = parts.map((part, index) => {
          if (index % 2 === 1) {
            const regex2 = /\{(.*?)\}/g;
            const link = part.split(regex2);
            if(link[1]?.includes("https")){
              return `<a href="javascript:void(0)" onclick="openModal()">${link[0]}</a>`
            } else {
              const dataDotGovLookup = {
                '/TEST/fdic/banks-d/docs/': 'https://pfabankfindui-d.app.cloud.gov/bankfind-suite',
                '/TEST/fdic/banks-n/docs/': 'https://pfabankfindui-n.app.cloud.gov/bankfind-suite',
                '/TEST/fdic/banks-q/docs/': 'https://pfabankfindui-q.app.cloud.gov/bankfind-suite'
              }
              const bfsUrlLookup = {
              'localhost': 'http://localhost:5000/bankfind-suite',
              'pfabankapi-n.app.cloud.gov':
                'https://pfabankfindui-n.app.cloud.gov/bankfind-suite',
              'pfabankapi-s.app.cloud.gov':
                'https://pfabankfindui-s.app.cloud.gov/bankfind-suite',
              'pfabankapi-q.app.cloud.gov':
                'https://pfabankfindui-q.app.cloud.gov/bankfind-suite',
              'pfabankapi-d.app.cloud.gov':
                'https://pfabankfindui-d.app.cloud.gov/bankfind-suite',
              'pfabankfindui.app.cloud.gov':
                'https://banks.data.fdic.gov/bankfind-suite',
              'banks.data.fdic.gov':
                'https://banks.data.fdic.gov/bankfind-suite',
              'banks-n.data.fdic.gov':
                'https:///pfabankfindui-n.app.cloud.gov/bankfind-suite',
              'banks-s.data.fdic.gov':
                'https:///pfabankfindui-s.app.cloud.gov/bankfind-suite',
              'banks-q.data.fdic.gov':
                'https:///pfabankfindui-q.app.cloud.gov/bankfind-suite',
              'api.fdic.gov': 
                'https://banks.data.fdic.gov/bankfind-suite'
            }
          
              const pathLookup = {
                "Help" : "/help?previousApp=API",
                "Api101": "/bulkData/api101"
              }
              const url = window.location.hostname === 'api.data.gov' 
                  ? `${dataDotGovLookup[window.location.pathname]}${pathLookup[link[1]]}` 
                  : `${bfsUrlLookup[window.location.hostname]}${pathLookup[link[1]]}`
        
              return `<a href=${url}>${link[0]}</a>`;
            }   
          }
          return `${part}`;
        })
        return arrayParts.join("")
      }
      const maintenanceURL = maintenanceLookup[window.location.pathname] || "/maintenance"
      const response = await fetch(maintenanceURL);
      const maintenanceData = await response.json();
        if(maintenanceData.data[0].data.is_active==="true") {
          document.getElementById('maintenance-banner').style.display = 'block';
          document.getElementById('banner-title').innerText = maintenanceData.data[0].data.title;
          document.getElementById('banner-text').innerHTML =textToLink(maintenanceData.data[0].data.description);
        } 
        else {
          document.getElementById('maintenance-banner').style.display = 'none'
          document.getElementById('banner-title').innerText  ='';
          document.getElementById('banner-text').innerText ='';
        }
      }
      logMaintenance()</script>
