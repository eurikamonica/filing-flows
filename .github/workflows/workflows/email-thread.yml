name: Email a thread on request

# The site's "Email me this thread" button opens a GitHub issue titled "Email thread: <ticker> <quarter> [<cik> <end>]".
# Only issues opened by the repository owner are acted on; the issue is closed with a short note afterwards.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  send:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Email thread:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TITLE: ${{ github.event.issue.title }}
      NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Fetch the company's data from the published site
        run: |
          REQ=$(python -c "import os, re; m = re.search(r'\[(\d+) (\d{4}-\d{2}-\d{2})\]\s*$', os.environ['TITLE']); print(f'{m[1]}:{m[2]}' if m else '')")
          if [ -z "$REQ" ]; then echo "::error::The title must end with [CIK YYYY-MM-DD]"; exit 1; fi
          echo "REQ=$REQ" >> "$GITHUB_ENV"
          mkdir -p _data/c
          curl -fsSL "$PAGES/data/c/${REQ%%:*}.json" -o "_data/c/${REQ%%:*}.json"
          python scripts/build_site.py --data _data --out _site

      - name: Send the thread
        run: python -m pipeline.social --site _site --one "$REQ"

      - name: Close the request
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            note="Sent to your inbox."
          else
            note="Could not send it. The run log says why: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$note"
