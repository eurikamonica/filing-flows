# A one-off look at SEC's Insider Transactions Data Sets (Forms 3/4/5): the listing, one set's tables and headers, and
# Tesla's rows — for disclosures/app/insiders_history.py. Removed once that reader is in.
name: Probe Form 345 data sets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
    steps:
      - name: Listing, one set, Tesla's rows
        run: |
          python3 - <<'PY'
          import io, os, re, csv, zipfile, urllib.request
          ua = os.environ['SEC_USER_AGENT']
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': ua}), timeout=300).read()
          for page in ['https://www.sec.gov/data-research/sec-markets-data/insider-transactions-data-sets', 'https://www.sec.gov/dera/data/form-345']:
              try:
                  html = get(page).decode('utf-8', 'replace')
                  links = re.findall(r'href="([^"]+form345[^"]*\.zip)"', html, re.I)
                  print(page, len(html), 'links', len(links)); print(links[:4]); print(links[-4:])
              except Exception as e:
                  print(page, 'ERR', e)
          u = 'https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/2025q3_form345.zip'
          b = get(u); print(u, len(b))
          z = zipfile.ZipFile(io.BytesIO(b))
          for n in z.namelist(): print('member', n, z.getinfo(n).file_size)
          acc = set()
          from collections import Counter
          rel = Counter()
          names = sorted(z.namelist(), key=lambda n: (not n.upper().endswith('SUBMISSION.TSV'), n))
          for n in names:
              if not n.upper().endswith('.TSV'): continue
              with z.open(n) as f:
                  rd = csv.reader(io.TextIOWrapper(f, encoding='utf-8', errors='replace', newline=''), delimiter='\t', quoting=csv.QUOTE_NONE)
                  head = next(rd); print('==', n, head)
                  rows = 0
                  for r in rd:
                      rows += 1
                      if n.upper().endswith('SUBMISSION.TSV') and len(r) == len(head):
                          d = dict(zip(head, r))
                          if d.get('ISSUERCIK', '').lstrip('0') == '1318605': acc.add(d['ACCESSION_NUMBER'])
                      if n.upper().endswith('REPORTINGOWNER.TSV') and len(r) > 3: rel[r[3]] += 1
                      if r and r[0] in acc and not n.upper().endswith('SUBMISSION.TSV') and not n.upper().endswith('FOOTNOTES.TSV'):
                          print('  TSLA', n.split('/')[-1], r[:40])
                      if r and r[0] in acc and n.upper().endswith('FOOTNOTES.TSV'):
                          print('  TSLA', n.split('/')[-1], r[0], r[1], r[2][:200])
                  print('   rows', rows)
          print('tesla filings', len(acc))
          print('relationships', rel.most_common(25))
          PY
