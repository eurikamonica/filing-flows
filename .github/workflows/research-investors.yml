# Investors (Disclosures → Investors, and the "Investments" view of each company page): which listed companies earn the
# most on their investments (gains on investments in their 10-Q / 10-K, SEC XBRL frames) and what they own or bought —
# their own 13F and 13D / 13G, their 8-K releases, and other companies' filings naming them as an investor (EDGAR
# full-text search). The largest gainers are read again weekly. app/investors.py.
# Kept on the branch "research-investors" (one commit, force-pushed); scan.yml publishes public/ at
# disclosures/data/research/investors/.
name: Research — investors
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes for reading filings'
        default: '40'
  schedule:
    - cron: '23 8 * * *'           # every day, 08:23 UTC
permissions:
  contents: write
concurrency:
  group: research-investors
  cancel-in-progress: false
jobs:
  investors:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: |
            /disclosures/app/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: The data branch and the site's companies
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" research-investors >/dev/null; then
            git clone --quiet --depth 1 --branch research-investors "$url" inv
          else
            mkdir inv && git -C inv init --quiet -b research-investors && git -C inv remote add origin "$url"
          fi
          site="${SITE_URL:-https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/}"
          mkdir -p site && curl -fsSL --retry 4 --retry-delay 5 "${site%/}/data/index.json" -o site/index.json
      - name: Read frames and filings
        id: collect
        timeout-minutes: 60
        run: python disclosures/app/investors.py collect --root inv --universe site/index.json --minutes "${{ inputs.minutes || '40' }}"
      - name: Build public/
        if: always() && steps.collect.outcome != 'skipped'
        timeout-minutes: 10
        run: python disclosures/app/investors.py build --root inv --universe site/index.json
      - name: Save to the branch (one commit, force-pushed)
        if: always()
        run: |
          cd inv
          [ -d cache ] || exit 0
          rm -rf raw
          printf '%s\n' '# research-investors (data only)' '' 'Gains on investments (cache/frames), what the largest gainers own or bought (cache/ev) and the files the' \
            'site publishes (public/), kept by .github/workflows/research-investors.yml on main.' > README.md
          git add -A
          git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" commit -q -m "investors $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git checkout -q --orphan fresh
          git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" commit -q -m "investors $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q --force origin fresh:research-investors && break; sleep $((i * 10)); done
          [ -f public/status.json ] && python -c "import json; print('::notice::' + json.dumps(json.load(open('public/status.json')))[:900])" || true
