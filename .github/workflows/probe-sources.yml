# Temporary: fetches raw samples of candidate news sources (press-release wires, war.gov contracts, FDA, SEC news and
# enforcement, GDELT, an EDGAR 8-K and the daily index) to the branch "probe-news" so the collectors can be written
# against real answers. Removed once the collectors are in.
name: Probe new data sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch samples
        shell: python
        run: |
          import json, os, re, time, requests
          os.makedirs('out', exist_ok=True)
          ua = os.environ['SEC_USER_AGENT']
          browser = 'Mozilla/5.0 (compatible; FilingFlows news reader; ' + ua + ')'
          log = []
          def get(name, url, sec=False, n=60000, **kw):
              try:
                  h = {'User-Agent': ua if sec else browser, 'Accept': kw.pop('accept', '*/*')}
                  r = requests.get(url, headers=h, timeout=40, **kw)
                  body = r.content
                  with open('out/' + name, 'wb') as f:
                      f.write(body[:n])
                  items = len(re.findall(rb'<item[ >]|<entry[ >]', body))
                  log.append([name, url, r.status_code, r.headers.get('content-type'), len(body), items, r.url if r.url != url else ''])
              except Exception as e:
                  log.append([name, url, 'error', str(e)[:200]])
              time.sleep(0.6)
          # second probe: the contract article, USAspending, more wire feeds, GDELT spaced out
          rss = requests.get('https://www.war.gov/DesktopModules/ArticleCS/RSS.ashx?ContentType=400&Site=945&max=3', headers={'User-Agent': browser}, timeout=40).text
          links = re.findall(r'<link>(https://www\.war\.gov/News/Contracts/Contract/Article/[^<]+)</link>', rss)
          if links:
              get('war-article.html', links[0].strip(), n=400000)
              get('war-article-plain.html', links[0].strip(), n=400000, accept='text/html')
          get('usaspending.json', 'https://api.usaspending.gov/api/v2/search/spending_by_award/', n=60000) if False else None
          try:
              r = requests.post('https://api.usaspending.gov/api/v2/search/spending_by_award/', json={
                  'filters': {'time_period': [{'start_date': '2026-10-10', 'end_date': '2026-10-17', 'date_type': 'action_date'}],
                              'award_type_codes': ['A', 'B', 'C', 'D'], 'agencies': [{'type': 'awarding', 'tier': 'toptier', 'name': 'Department of Defense'}],
                              'award_amounts': [{'lower_bound': 50000000}]},
                  'fields': ['Award ID', 'Recipient Name', 'Award Amount', 'Start Date', 'Description', 'Awarding Sub Agency', 'recipient_id'],
                  'sort': 'Award Amount', 'order': 'desc', 'limit': 10, 'page': 1}, headers={'User-Agent': browser}, timeout=60)
              open('out/usaspending.json', 'wb').write(r.content[:60000]); log.append(['usaspending.json', r.status_code, len(r.content)])
          except Exception as e:
              log.append(['usaspending', 'error', str(e)[:200]])
          for name, url in [('prn-health.xml', 'https://www.prnewswire.com/rss/health-latest-news/health-latest-news-list.rss'),
                            ('prn-tech.xml', 'https://www.prnewswire.com/rss/consumer-technology-latest-news/consumer-technology-latest-news-list.rss'),
                            ('prn-energy.xml', 'https://www.prnewswire.com/rss/energy-latest-news/energy-latest-news-list.rss'),
                            ('prn-business.xml', 'https://www.prnewswire.com/rss/business-technology-latest-news/business-technology-latest-news-list.rss'),
                            ('prn-earnings.xml', 'https://www.prnewswire.com/rss/financial-services-latest-news/earnings-list.rss'),
                            ('gnw-us.xml', 'https://www.globenewswire.com/RssFeed/country/United%20States/feedTitle/GlobeNewswire%20-%20News%20from%20United%20States'),
                            ('gnw-search.xml', 'https://www.globenewswire.com/rss/list'),
                            ('bw-all.xml', 'https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeGVtRWA=='),
                            ('newsfile.xml', 'https://feeds.newsfilecorp.com/feed/newsfile-latest-news')]:
              get(name, url)
          for q in ['%22Boeing%22', '%22Pfizer%22']:
              time.sleep(12)
              get('gdelt-' + q.strip('%22').lower() + '.json', f'https://api.gdeltproject.org/api/v2/doc/doc?query={q}%20sourcelang:english&mode=artlist&maxrecords=10&format=json&timespan=48h&sort=hybridrel')
          with open('out/log.json', 'w') as f:
              json.dump(log, f, indent=1)
          print(json.dumps(log, indent=1))
      - name: Save to the branch probe-news
        run: |
          python -c "import json; print('::notice title=probe log::' + json.dumps(json.load(open('out/log.json')))[:60000])"
          cd out
          rm -f accesswire.xml war-contracts.html gnw-*.xml sec-litigation-old.xml    # error pages, not samples
          python - <<'PY'
          import pathlib, re
          for p in pathlib.Path('.').iterdir():          # page scripts carry map / analytics tokens push protection rejects
              b = p.read_bytes()
              p.write_bytes(re.sub(rb'[ps]k\.eyJ[A-Za-z0-9._-]+', b'TOKEN', b))
          PY
          git init -q -b probe-news
          git add -A
          git -c user.name=filing-flows -c user.email=actions@users.noreply.github.com commit -qm "probe $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do
            if out=$(git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:probe-news 2>&1); then echo pushed; exit 0; fi
            echo "::warning title=push failed::$(echo "$out" | tr '\n' ' ' | sed 's/x-access-token:[^@]*@/x:***@/g' | cut -c1-900)"
            sleep 10
          done
          exit 1
