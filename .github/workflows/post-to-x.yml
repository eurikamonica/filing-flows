name: Post to X

# The owner's "Post to X" buttons on a company page (send_requests kinds post / post_holders): draw the chart, have the
# model write one post from config/tweet-guide.md + the filing (or the Disclosures holders data), publish the images on
# the "media" branch and queue the post in Buffer. Separate from "Send requested reports" so it never waits behind
# reader e-mails.
#
# How it stays quick: GitHub runs cron schedules late and unevenly (a "*/5" schedule often fires every 20-40 minutes),
# so a run does not rely on cron. Each watch run keeps checking Supabase for ~4 minutes and, when it ends, starts the
# next watch run itself (workflow_dispatch with chained=true) — a continuous relay, one run at a time, with a button
# press picked up within about 20 seconds. The post job holds the concurrency group, not the run, so the next watch
# run's job starts the moment this one's ends, and a last job (relay) sees that it did: GitHub now and then fails a run
# as it starts (no job at all — on Nov 9, 2026 the relay broke on such a start and stayed down for six hours, until the
# cron came), and such a run is started again (scripts/start-run.sh). The cron only restarts the relay if it ever
# breaks all the same; the repository variable POST_WATCH=off stops it (runs then happen only on the cron / a Supabase
# wake / Run workflow).
#
# The owner lane rides on the same relay: every check also starts the workflow for the owner's other requests — a short
# scan (scan.yml, fast) for the owner's companies and re-reads, "Send requested reports" for the owner's e-mails and
# comparisons — so they are picked up within seconds too (pipeline/owner_lane.py; actions: write below). On weekdays
# from 9:10 to 4 pm New York it also keeps the hub's live Move odds relay (intraday.yml) running, which GitHub's
# schedule alone starts late or not at all (INTRADAY_RELAY=off stops it), and from 4:11 to 8 pm it starts the Move
# odds at the close (moves-close.yml) until the day's close is on file.

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [post-request]
  workflow_dispatch:
    inputs:
      chained:
        description: "Started by the previous watch run (leave off when running by hand)"
        type: boolean
        default: false

permissions:
  contents: write      # the "media" branch holds the chart images Buffer loads
  models: read         # GitHub Models writes the post text (pipeline/tweet.py)
  actions: write       # starts the next watch run, and the owner lane's scan / requests runs

jobs:
  post:
    if: vars.SUPABASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:          # the job, not the run: the next watch run's job starts as soon as this one is done, while this
      group: post-to-x    # run's last job (relay) sees that it did
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      SITE_URL: ${{ vars.SITE_URL }}
      MEDIA_DIR: media
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL_API_URL: ${{ vars.MODEL_API_URL }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      TWEET_MODEL: ${{ vars.TWEET_MODEL }}
      LOCAL_MODEL: ${{ vars.LOCAL_MODEL || '1' }}            # free fallback after the API models (pipeline/local_model.py); 0 turns it off
      LOCAL_BASE_MODEL: ${{ vars.LOCAL_BASE_MODEL }}
      INTRADAY_RELAY: ${{ vars.INTRADAY_RELAY }}                  # off: the owner lane leaves intraday.yml alone
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}          # Owner tools: Reddit question / list posts
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:                      # the app only: skip disclosures/ (the hub's multi-GB data), which this job never reads
          sparse-checkout: |
            pipeline
            config
            scripts
            web
            supabase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Anything waiting?
        id: due
        env:
          # GitHub runs schedules at most every 5 minutes, so a scheduled run keeps watching for most of its slot
          # (one check every POLL_SECONDS, up to WATCH_SECONDS) — a button press is picked up within ~20 seconds.
          # A manual run or a Supabase wake (repository_dispatch) checks once; a relay run (schedule / chained) watches.
          WATCH_SECONDS: ${{ (github.event_name == 'schedule' || inputs.chained) && vars.POST_WATCH != 'off' && 240 || 0 }}
          POLL_SECONDS: 20
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          site="${SITE_URL:-https://$owner.github.io/${GITHUB_REPOSITORY#*/}/}"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          start=$(date +%s)
          while :; do
            # the owner's other requests (companies, re-reads, e-mails, comparisons): start their workflow now
            # instead of waiting for its late schedule (pipeline/owner_lane.py)
            python -m pipeline.owner_lane wake || true
            rc=0; python -m pipeline.notify --site "$site" --requests --posts --due || rc=$?
            if [ $rc = 0 ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ $rc != 1 ]; then exit $rc; fi
            if [ $(( $(date +%s) - start )) -ge "$WATCH_SECONDS" ]; then break; fi
            sleep "$POLL_SECONDS"
          done
          echo "nothing waiting"; echo "go=no" >> "$GITHUB_OUTPUT"
      - name: Draw the chart and write the post
        if: steps.due.outputs.go == 'yes'
        run: |
          mkdir -p media/x      # the engagement posts' cooldown state lives on the media branch
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/media/x/engage-state.json" -o media/x/engage-state.json || true
          pip install playwright
          python -m playwright install chromium || echo 'using the runner’s Google Chrome'
          python -m pipeline.notify --site "${{ steps.due.outputs.site }}" --site-url "${{ steps.due.outputs.site }}" --requests --posts
      - name: Publish the images and queue the post in Buffer
        if: steps.due.outputs.go == 'yes'
        run: scripts/publish-media.sh
      - name: Start the next watch run
        if: always() && (github.event_name == 'schedule' || inputs.chained) && vars.POST_WATCH != 'off'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # one relay at a time: skip if another watch run is already queued or running. GitHub's dispatch endpoint
          # answers HTTP 500/502 now and then, which broke the relay until the late cron restarted it; so try up to
          # three times, re-checking first (a failed answer can still have started the run).
          for attempt in 1 2 3; do
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow post-to-x.yml --status queued --json databaseId --jq length)
            m=$(gh run list -R "$GITHUB_REPOSITORY" --workflow post-to-x.yml --status in_progress --json databaseId --jq length)
            if [ "${n:-0}" -gt 0 ] || [ "${m:-0}" -gt 1 ]; then echo "another watch run is already waiting"; exit 0; fi
            if gh workflow run post-to-x.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f chained=true; then exit 0; fi
            [ "$attempt" -lt 3 ] && { echo "::warning::starting the next watch run failed (attempt $attempt), retrying"; sleep $((attempt * 20)); }
          done
          exit 1

  relay:
    # after the post job has let go of the group: the watch run it started has got going — or it failed as it started
    # (GitHub, now and then: no job at all), or there is none (the post job stopped before its last step: a timeout),
    # and one is started (scripts/start-run.sh: started again until it gets going). A Supabase wake (repository_dispatch)
    # checks once and starts no run after it, so it is not the relay's next run.
    needs: post
    if: always() && needs.post.result != 'skipped' && needs.post.result != 'cancelled' && (github.event_name == 'schedule' || inputs.chained) && vars.POST_WATCH != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/start-run.sh
          sparse-checkout-cone-mode: false
      - name: Did the next watch run get going?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          since=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .created_at 2>/dev/null || true)
          since=${since:-$(date -u -d '-6 minutes' +%Y-%m-%dT%H:%M:%SZ)}       # this run began at most this long ago
          s=none
          for _ in $(seq 1 12); do
            s=$(gh run list -R "$GITHUB_REPOSITORY" --workflow post-to-x.yml --limit 10 --json databaseId,event,status,conclusion,createdAt \
                  --jq "[.[] | select(.databaseId != $RUN_ID and .event != \"repository_dispatch\" and .createdAt > \"$since\")] | sort_by(.createdAt) | last | if . == null then \"none\" else .status + \" \" + (.conclusion // \"\") end" \
                  2>/dev/null || echo none)
            case "$s" in
              "in_progress "*|"completed success"|"completed skipped"|"completed cancelled") echo "the next watch run is on ($s)"; exit 0 ;;
              "completed "*) echo "::warning::the next watch run failed as it started ($s): starting it again"; break ;;
            esac
            sleep 10
          done
          case "$s" in "queued "*|"pending "*|"waiting "*|"requested "*) echo "the next watch run is waiting to start ($s)"; exit 0 ;; esac
          bash scripts/start-run.sh post-to-x.yml -f chained=true
