name: Hidden leverage contract checks
on:
  pull_request:
    paths:
      - "disclosures/app/hidden_leverage.py"
      - "disclosures/app/hidden_leverage_tables.py"
      - "disclosures/app/revenue_quality.py"
      - "disclosures/app/debt.py"
      - "disclosures/docs/hidden-leverage.js"
      - "disclosures/docs/quality-view.js"
      - "disclosures/docs/hidden-leverage.css"
      - "disclosures/docs/index.html"
      - "disclosures/docs/debt-view.js"
      - "tests/test_hidden_leverage.py"
      - "tests/test_hidden_leverage_phase2.py"
      - ".github/workflows/hidden-leverage-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            disclosures/app
            disclosures/docs/index.html
            disclosures/docs/debt-view.js
            disclosures/docs/hidden-leverage.js
            disclosures/docs/quality-view.js
            tests/test_hidden_leverage.py
            tests/test_hidden_leverage_phase2.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Python syntax and all data-classification tests
        run: |
          python -m py_compile disclosures/app/hidden_leverage.py disclosures/app/hidden_leverage_tables.py disclosures/app/revenue_quality.py disclosures/app/debt.py
          python -m unittest discover -s tests -p test_hidden_leverage.py -v
          python -m unittest discover -s tests -p test_hidden_leverage_phase2.py -v
      - name: Validate Disclosure Hub scripts
        run: |
          node --check disclosures/docs/hidden-leverage.js
          node --check disclosures/docs/quality-view.js
          node --check disclosures/docs/debt-view.js
