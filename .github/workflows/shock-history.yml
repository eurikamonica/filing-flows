name: Shock panel history backfill
on:
  schedule:
    - cron: '7-57/10 * * * *'
  push:
    branches: [main]
    paths: ['pipeline/shock_history.py', '.github/workflows/shock-history.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shock-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependency and verify identity
        run: |
          pip install requests
          if [[ "$SEC_USER_AGENT" != *@* ]]; then
            echo '::error::SEC_USER_AGENT requires the existing project contact.'
            exit 1
          fi
      - name: Restore incremental history
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" shock-history >/dev/null; then
            git clone -q --depth 1 --branch shock-history "$remote" shock-state
          else
            mkdir shock-state
            git -C shock-state init -q -b shock-history
            git -C shock-state remote add origin "$remote"
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Read full SEC history with a bounded batch
        timeout-minutes: 10
        run: python -m pipeline.shock_history --root shock-state --limit 900 --minutes 8
      - name: Persist completed company histories even after interruption
        if: always() && steps.restore.outputs.ready == 'true'
        run: |
          cd shock-state
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name=filing-flows -c user.email=actions@users.noreply.github.com commit -q -m 'Refresh shock panel quarterly histories'
            git push -q origin HEAD:shock-history
          fi
