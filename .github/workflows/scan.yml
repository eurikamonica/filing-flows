name: Scan EDGAR and publish

on:
  # A merge changing the EPS model triggers a fresh production Pages build.
  push:
    branches: [main]
    paths:
      - 'pipeline/eps_gaap.py'
      - 'pipeline/eps_fundamental.py'
      - 'web/eps-research.js'
      - 'web/eps-research.css'
      - 'web/appearance.js'
      - 'web/appearance.css'
      - 'web/index.html'
      - 'web/app.js'
      - 'web/company-disclosures.js'
      - 'web/company-disclosures.css'
      - 'web/mascot.js'
      - 'web/studio.js'
      - 'scripts/build_site.py'
      - '.github/workflows/scan.yml'
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 minutes, away from :00 and :30 (GitHub delays busy minutes most)
  repository_dispatch:
    types:
      - company-request            # a reader asked for a company the site does not have (Supabase wake, optional; the owner's: fast lane)
      - scan                       # an outside clock (Supabase pg_cron, see README): on time, unlike GitHub's schedule
      - reread                     # the owner asked to re-read stored figures (Owner tools; Supabase wake, optional)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Also read EDGAR's daily index for this many past days (first run: 3-7)"
        required: false
        default: "0"
      max_filings:
        description: "Most filings to process in this run"
        required: false
        default: "1500"
      companies:
        description: "Owner: also build these companies now (tickers or CIKs, comma-separated, e.g. MS, GS)"
        required: false
        default: ""
      reread:
        description: "Owner: re-read these companies' stored figures from SEC now (tickers or CIKs; ALL = every company, a few dozen per run)"
        required: false
        default: ""
      fast:
        description: "Owner fast lane: a short scan for requested companies (set by the relay; leave blank by hand)"
        required: false
        default: ""
      hop:
        description: "Fast-lane relay hop (stops after 6)"
        required: false
        default: "0"

permissions:
  contents: write      # push the data branch
  pages: write
  id-token: write
  models: read         # GitHub Models writes the Buffer post (pipeline/tweet.py); free with the Actions token
  actions: write       # the owner's fast lane starts the next short scan itself

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}   # a secret keeps the email out of public logs
    steps:
      # The repository is ~9 GB, ~7 GB of it the hub's 13F quarter files and N-PX vote records, which the site build
      # never reads (stage-public.py serves them from raw.githubusercontent.com): leave them out, ~7 min → ~1 min.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/disclosures/docs/data/shards/holdings/
            !/disclosures/docs/data/shards/npx/

      - name: Check configuration
        run: |
          if [[ "$SEC_USER_AGENT" != *@* ]]; then
            echo "::error::Add the repository secret SEC_USER_AGENT = 'Your Name your@email.com' (Settings → Secrets and variables → Actions → New repository secret). The SEC requires it."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore the data store (branch "data")
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --quiet --depth 1 --branch data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" store
          else
            mkdir store && git -C store init --quiet -b data
            git -C store remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

      - name: Companies readers asked for (site search)
        id: claim
        continue-on-error: true                 # without Supabase, or before schema.sql is run again: none
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OWNER_COMPANIES: ${{ github.event.inputs.companies }}
          OWNER_REREAD: ${{ github.event.inputs.reread }}
        run: |
          # requests the owner makes from now on are not this scan's: a regular scan wraps up early for them (owner lane)
          echo "OWNER_CLAIMED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          python -m pipeline.custom claim-companies --out build-ciks.txt --owner-out owner-ciks.txt || true
          printf '%s\n' "$OWNER_COMPANIES" >> build-ciks.txt     # the owner's own list (Run workflow), no sign-in needed
          python -m pipeline.custom claim-rereads --out reread-ciks.txt || true    # Owner tools: "Re-read stored figures"
          printf '%s\n' "$OWNER_REREAD" >> reread-ciks.txt
          # the owner's fast lane: the owner's own companies (site request or Run workflow) or re-reads (owner only) make
          # this a short scan; the watch relay (post-to-x.yml → pipeline/owner_lane.py) starts one within seconds
          if [ -s owner-ciks.txt ] || [ -n "$(echo "$OWNER_COMPANIES" | tr -d ' ,')" ] || grep -q '[0-9]' reread-ciks.txt \
             || [ "${{ github.event.inputs.fast }}" = "true" ]; then
            echo "fast=true" >> "$GITHUB_OUTPUT"
            echo "::notice::owner fast lane: a short scan for $(tr '\n' ' ' < owner-ciks.txt 2>/dev/null)$OWNER_COMPANIES$(grep -q '[0-9]' reread-ciks.txt && echo " re-read $(tr '\n' ' ' < reread-ciks.txt)")"
          fi

      - name: Scan new 10-Q / 10-K filings and build charts
        timeout-minutes: 42          # never the whole job: the data store is still saved below, so no work is lost
        env:
          RUN_BUDGET_MINUTES: ${{ steps.claim.outputs.fast == 'true' && '9' || '32' }}   # the pipeline stops taking on new work after this (pipeline/build.py time_up); the owner's fast lane: 9
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}               # the owner's X post options for the threads on company pages
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OWNER_FAST: ${{ steps.claim.outputs.fast }}          # a fast scan never makes way; a regular one does (owner lane)
        run: |
          touch reread-ciks.txt
          python -m pipeline.build run --store store --out _site/data --build-ciks-file build-ciks.txt \
            --reread-ciks-file reread-ciks.txt \
            --backfill-days "${{ github.event.inputs.backfill_days || 0 }}" \
            --max-filings "${{ github.event.inputs.max_filings || 1500 }}"

      - name: Tell readers their companies are in
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m pipeline.custom finish-rereads || true
          python -m pipeline.custom finish-companies --site _site

      # Conservative first-filed GAAP EPS: a rotating set of SEC companyfacts each scan.
      # Files are saved with the regular data store and copied into Pages output.
      - name: SEC GAAP EPS series (companies not read yet or with a newer filing, largest first) and walk-forward
        continue-on-error: true
        timeout-minutes: 7
        run: python -m pipeline.eps_gaap --store store --index _site/data/index.json --out _site/data/eps-gaap --max-fetch 200 --budget 240

      - name: Share pictures drawn so far (og/index.json on the media branch; pipeline/ogimg.py)
        run: curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/media/og/index.json" -o _og.json || echo "no share pictures yet"

      - name: Assemble site
        env:                                   # public values (repository variables): the sign-in box on the site
          OG_MANIFEST: _og.json                          # each page's own share picture, when one is drawn
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}       # optional: shown on the privacy and terms pages
          SITE_URL: ${{ vars.SITE_URL }}                 # optional: your own domain → CNAME file for GitHub Pages
        run: python scripts/build_site.py --data _site/data --out _site

      - name: The long rotation history (public/ of the branch rotation-history, when it exists)
        continue-on-error: true
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" rotation-history >/dev/null; then
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch rotation-history "$url" _hist
            git -C _hist sparse-checkout set public
            du -sh _hist/public
          fi

      - name: Debt & rates (public/ of the branch debt-history, when it exists)
        continue-on-error: true
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" debt-history >/dev/null; then
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch debt-history "$url" _debt
            git -C _debt sparse-checkout set public
            du -sh _debt/public
          fi

      - name: Consensus (public/ of the branch consensus-history, when it exists)
        continue-on-error: true
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" consensus-history >/dev/null; then
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch consensus-history "$url" _cons
            git -C _cons sparse-checkout set public
            du -sh _cons/public
          fi

      - name: EPS forecast - fundamentals, consensus converted to GAAP, guidance; ranges; the frozen-forecast ledger
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python -m pipeline.eps_fundamental --store store/eps-fundamental --out _site/data/eps-fundamental \
            --consensus _cons/public/c --guide store/eps-guide --ledger store/eps-ledger.json --index _site/data/index.json

      - name: Price ladders (public/ of the branch ladder-history, when it exists)
        continue-on-error: true
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" ladder-history >/dev/null; then
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch ladder-history "$url" _lad
            git -C _lad sparse-checkout set public
            du -sh _lad/public
          fi

      - name: ETFs (public/ of the branch etf-history, when it exists)
        continue-on-error: true
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" etf-history >/dev/null; then
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch etf-history "$url" _etf
            git -C _etf sparse-checkout set public
            du -sh _etf/public
          fi

      - name: Smart money (public/ of the branch smart-history, when it exists)
        continue-on-error: true
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" smart-history >/dev/null; then
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch smart-history "$url" _smart
            git -C _smart sparse-checkout set public
            du -sh _smart/public
          fi

      - name: Research modules (public/ of every branch named research-*, when any exist)
        continue-on-error: true
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir -p _research
          for b in $(git ls-remote --heads "$url" 'research-*' | sed 's#.*refs/heads/##'); do
            if git clone --quiet --depth 1 --filter=blob:none --sparse --branch "$b" "$url" "_rs_tmp" && git -C _rs_tmp sparse-checkout set public && [ -d _rs_tmp/public ]; then
              mv _rs_tmp/public "_research/${b#research-}"
            fi
            rm -rf _rs_tmp
          done
          du -sh _research/* 2>/dev/null || true

      - name: Read the independently refreshed industry ledger snapshot
        continue-on-error: true
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" industry-ledger-data >/dev/null; then
            git clone -q --depth 1 --filter=blob:none --sparse --branch industry-ledger-data "$url" _industry
            git -C _industry sparse-checkout set public
          else
            echo "::notice::No industry-ledger-data snapshot yet; research pages will report no collection."
          fi

      - name: Add the Disclosure Hub (disclosures/docs → /disclosures/ on the site)
        run: python disclosures/automation/stage-public.py --out _site/disclosures --site-data _site/data --history _hist/public --debt _debt/public --consensus _cons/public --etf _etf/public --smart _smart/public --ladders _lad/public --research _research

      - name: Evaluate all archived company EPS surprises and resolved Polymarket contracts
        continue-on-error: true
        timeout-minutes: 4
        run: |
          if test -d _cons/public/c; then
            python -m pipeline.eps_research --consensus _cons/public/c \
              --market _cons/public/calibration.json \
              --out _site/data/eps-research/backtest.json --gaap store/eps-gaap
          else
            echo "::notice::Consensus snapshot unavailable; EPS cross-section not recalculated"
          fi

      - name: Global search index and Atom feeds (data/search.json, feeds/; after the hub is staged)
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/hub_extras.py --site _site
      - name: Pages for search engines about 13F managers and officials (m/<slug>/, o/<slug>/)
        env:
          SITE_URL: ${{ vars.SITE_URL }}               # your own domain: canonical links and sitemap-people.xml use it, not github.io
        run: python scripts/seo_people.py --people _site/disclosures/data/research/people --out _site

      - name: Integrate SIC relationships, markets and audit-visible research pages
        run: |
          python scripts/integrate_industry.py --site _site --snapshot _industry/public
          test -s _site/data/industry-intelligence/integration-health.json
          test -s _site/supplier-revenue/index.html
          test -s _site/integration-health/index.html

      # Your own server (README "Your own domain and server"): with the repository variable SELF_HOST = true the built
      # site is also pushed to the branch "site", which the server pulls every few minutes. GitHub Pages keeps running.
      - name: Publish the site to the "site" branch (for your own server)
        if: vars.SELF_HOST == 'true'
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/site" && cp -r _site "$RUNNER_TEMP/site" && cd "$RUNNER_TEMP/site"
          git init -q -b site
          git add -A
          git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" commit -q -m "site $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:site

      - name: The owner's daily report (8:00 owner time) and X threads (e-mail, or the X API)
        if: steps.claim.outputs.fast != 'true'  # the owner's fast lane skips it: the next regular scan sends
        continue-on-error: true                 # sending trouble never blocks the site
        timeout-minutes: 8                      # leaves time to save the data store within the job's 55 minutes
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}               # the owner's settings (#owner page) and address
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}            # config/x.json mode "buffer": posts queued in Buffer
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}            # the model that writes the post: Gemini (free tier)…
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}      # …or Claude…
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}            # …or OpenAI (GitHub Models was retired 30 Jul 2026)
          MODEL_API_URL: ${{ vars.MODEL_API_URL }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          TWEET_MODEL: ${{ vars.TWEET_MODEL }}                     # optional: model name override
          LOCAL_MODEL: ${{ vars.LOCAL_MODEL || '1' }}            # free fallback after the API models (pipeline/local_model.py); 0 turns it off
          LOCAL_BASE_MODEL: ${{ vars.LOCAL_BASE_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}               # reads the trained adapter from the "model" branch
          SITE_URL: ${{ vars.SITE_URL }}                       # your own domain, when the site has one
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          export X_SITE_URL="${SITE_URL:-https://$owner.github.io/${GITHUB_REPOSITORY#*/}/}"   # works on scheduled runs too
          if python -m pipeline.social --site _site --store store --check; then
            pip install playwright
            python -m playwright install chromium || echo 'using the runner’s Google Chrome'
            python -m pipeline.social --site _site --store store
          else
            python -m pipeline.social --site _site --store store --dry-run
          fi

      - name: Save the data store
        if: always()
        run: |
          [ -d store/.git ] || exit 0          # nothing to save when an earlier step stopped the run
          cd store
          git add -A
          git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" \
            commit --quiet --amend -m "data $(date -u +%Y-%m-%dT%H:%MZ)" \
          || git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" \
            commit --quiet -m "data $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git rev-parse --verify --quiet HEAD >/dev/null || exit 0   # nothing was stored yet
          git push --quiet --force origin HEAD:data

      - name: Owner fast lane — the next short scan while the owner's companies are not all in
        if: steps.claim.outputs.fast == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HOP: ${{ github.event.inputs.hop || '0' }}
        run: |
          # a relay like post-to-x.yml: this run's site deploys first (same concurrency group), then the next short scan,
          # while an owner request from the last 2 hours is not built (pipeline/custom.py FAST_LANE_MINUTES), 6 hops at most
          if [ "$HOP" -ge 6 ]; then echo "fast-lane relay cap (6 short scans) reached; the regular scans carry on"; exit 0; fi
          if python -m pipeline.custom has-owner-companies; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow scan.yml --status queued --json databaseId --jq length)
            if [ "${n:-0}" -gt 0 ]; then echo "a scan is already queued: it claims the owner's companies"; exit 0; fi
            gh workflow run scan.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f fast=true -f hop=$((HOP + 1))
            echo "fast lane: short scan $((HOP + 1)) started"
          fi


      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A successful artifact upload or deploy job is not proof that the current browser
  # receives the code. Test public URLs and the exact Actions build id after deploy.
  verify-integration:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12          # the probes wait out the CDN's ten-minute cache (scripts/verify_production.py)
    steps:
      # code only: this job reads the published site (artifact or URL), never the hub's data (~9 GB with it, ~7 min)
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/disclosures/docs/data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit live production routes
        run: |
          python scripts/verify_production.py \
            --base "${{ vars.SITE_URL || needs.deploy.outputs.page_url }}" \
            --run-id "${{ github.run_id }}"

  # IndexNow (scripts/indexnow.py): new, changed or removed pages from the live sitemaps go to Bing, Yandex, Naver,
  # Seznam and Yep in one request. The last accepted list is kept in the Actions cache; without it, every page is sent.
  # Google does not take part: it reads sitemap.xml (Search Console). Problems are warnings, never a failed site.
  indexnow:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/indexnow.py
            /config/indexnow.json
      - name: The last accepted list
        uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-
      - name: Send new and changed pages
        id: submit
        env:
          SITE_URL: ${{ vars.SITE_URL || needs.deploy.outputs.page_url }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}           # optional: replaces the key in config/indexnow.json
        run: python3 scripts/indexnow.py submit --state .indexnow/state.json
      - name: Keep the accepted list for the next scan
        if: steps.submit.outputs.saved == 'true'
        uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}-${{ github.run_attempt }}

  # E-mail alerts to readers who signed up on the site (after the new charts are live, so the links work).
  # Needs the repository variable SUPABASE_URL and the secret SUPABASE_SERVICE_KEY; uses the same MAIL_* secrets.
  # Sending from your own computer instead (scripts/alerts-laptop.ps1)? Leave SUPABASE_SERVICE_KEY out of GitHub.
  alerts:
    needs: deploy
    if: vars.SUPABASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      MAIL_DAILY_LIMIT: ${{ vars.MAIL_DAILY_LIMIT }}
      DIGEST_HOUR: ${{ vars.DIGEST_HOUR }}              # optional: the daily report's hour for readers without a saved one (8)
      DIGEST_TZ: ${{ vars.DIGEST_TZ }}                  # optional: their time zone (America/New_York)
      SITE_URL: ${{ vars.SITE_URL || needs.deploy.outputs.page_url }}   # links in the e-mails: your own domain if set
    steps:
      # code only: this job reads the published site (artifact or URL), never the hub's data (~9 GB with it, ~7 min)
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/disclosures/docs/data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: The site that was just published
        uses: actions/download-artifact@v4
        with:
          name: github-pages
      - run: mkdir _site && tar -xf artifact.tar -C _site
      - name: Send alert e-mails
        run: |
          rc=0; python -m pipeline.notify --site _site --due || rc=$?
          if [ $rc = 1 ]; then exit 0; fi            # nothing due this hour
          if [ $rc != 0 ]; then exit $rc; fi         # wrong key, Supabase down: show the error
          pip install playwright
          python -m playwright install chromium || echo 'using the runner’s Google Chrome'
          python -m pipeline.notify --site _site

  # Threads queued in Buffer (config/x.json "mode": "buffer"): after the site is live, because Buffer loads the chart
  # images from their public URLs. Needs the secret BUFFER_API_KEY; BUFFER_CHANNEL_ID (variable) picks the X channel.
  buffer:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      SITE_URL: ${{ vars.SITE_URL || needs.deploy.outputs.page_url }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}                 # the owner's X post options (#owner page)
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      # code only: this job reads the published site (artifact or URL), never the hub's data (~9 GB with it, ~7 min)
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/disclosures/docs/data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt     # pipeline/buffer.py loads pipeline/social.py (BeautifulSoup)
      - name: The site that was just published
        uses: actions/download-artifact@v4
        with:
          name: github-pages
      - run: mkdir _site && tar -xf artifact.tar -C _site
      - name: Queue new threads in Buffer (images from the media branch)
        # Buffer posts from its queue hours later; by then the next deploy has replaced the site and its x/ images,
        # so the charts go to the long-lived media branch and Buffer is given those URLs (raw.githubusercontent.com)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f _site/x/pending.json ]; then
            mkdir -p media/x && cp _site/x/pending.json _site/x/*.png media/x/ 2>/dev/null || true
            cp _site/x/*.gif media/x/ 2>/dev/null || true
            MEDIA_DIR=media bash scripts/publish-media.sh
          else
            echo "buffer: nothing queued by the scan"
          fi
