# Disclosure Hub (disclosures/): 13F, House + Senate, Form 4, 8-K, 13D / 13G, Form 144, FINRA short interest, news wires and
# government releases, COT, FDIC bank and N-PX collection.
# This workflow only collects and commits disclosures/docs/data/ to main. The site itself is published
# by scan.yml, which copies disclosures/docs into _site/disclosures/ on its hourly run.
name: Collect disclosures
on:
  workflow_dispatch:
    inputs:
      module:
        description: Data module to update
        type: choice
        options: [all, holdings, congress, cot, banks, npx, markets, prices, market, insiders, options, ownership, shorts, senate, events8k, news, reddit, extremes]
        default: all
      batch_size:
        description: Optional entity/filer/PDF batch size (blank uses config)
        type: string
        default: ''
      manager_cik:
        description: Optional 13F or N-PX CIK (choose matching module)
        type: string
        default: ''
      report_id:
        description: Optional discovered House report ID (choose congress module)
        type: string
        default: ''
      bank_cert:
        description: Optional FDIC certificate (choose banks)
        type: string
        default: ''
      market_id:
        description: Optional dataset-code (choose cot)
        type: string
        default: ''
      revalidate:
        description: Re-download stored SEC / House documents
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '17 * * * *'
    - cron: '43 0-9,11-23 * * *'
    - cron: '43 10 * * *'
    - cron: '28,58 * * * *'
    - cron: '20 21 * * 1-5'
    - cron: '11 */6 * * *'
    - cron: '41 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'disclosures/app/**'
      - 'disclosures/tests/**'
      - 'disclosures/config/**'
      - 'disclosures/imports/**'
      - 'disclosures/requirements.txt'
      # (market views rebuild with the scheduled runs; module 'market' rebuilds them now)
      - '.github/workflows/disclosures.yml'
permissions:
  contents: write
concurrency:
  # light runs (insiders + 8-K + 13D / 13G / Form 144 + short interest + Senate PTRs + news, market views) queue separately so the long 13F / officials runs never cancel them.
  # The once-a-day run after the close (option chains, 52-week and all-time highs and lows) has a group of its own: in the light group a
  # pending run is replaced by the next half-hourly one, so it was cancelled most days and the highs / lows posts had nothing to read.
  group: disclosures-${{ (github.event.schedule == '11 */6 * * *' || inputs.module == 'prices') && 'prices' || (github.event.schedule == '20 21 * * 1-5' || inputs.module == 'options' || inputs.module == 'extremes') && 'close' || ((github.event.schedule == '28,58 * * * *' || github.event.schedule == '41 */3 * * *' || inputs.module == 'insiders' || inputs.module == 'market' || inputs.module == 'ownership' || inputs.module == 'shorts' || inputs.module == 'senate' || inputs.module == 'events8k' || inputs.module == 'news' || inputs.module == 'reddit') && 'light' || 'main') }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: disclosures
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Which source this run collects (the schedule, the button, or a code push), decided before the checkout so the
      # checkout can leave out what the run never reads: the repository is ~9 GB (a full checkout ~6.5 min, every
      # quarter hour), ~5.5 GB of it N-PX vote records and ~1.8 GB 13F quarter files.
      - name: Pick the module
        id: pick
        working-directory: .
        shell: bash
        env:
          REQUESTED_MODULE: ${{ inputs.module }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          module="${REQUESTED_MODULE:-all}"
          if [ "$EVENT_NAME" = push ]; then module=congress; fi   # code pushes: a quick officials run; schedules cover the rest
          case "$EVENT_SCHEDULE" in
            '7,22,37,52 * * * *') module=holdings ;;
            '17 * * * *') module=congress ;;
            '43 0-9,11-23 * * *') module=markets ;;
            '43 10 * * *') module=all ;;
            '28,58 * * * *') module=insiders ;;
            '20 21 * * 1-5') module=options ;;
            '11 */6 * * *') module=prices ;;
            '41 */3 * * *') module=market ;;
          esac
          echo "module=$module" >> "$GITHUB_OUTPUT"
          # light sources never read or write the 13F quarter files or the N-PX records; 13F runs never touch N-PX.
          # N-PX, the market data (COT, FDIC, N-PX), prices and the daily all-source run keep the full checkout.
          case "$module" in
            insiders|ownership|shorts|senate|events8k|news|reddit|options|extremes|market|congress)
              skip=$'!/disclosures/docs/data/shards/holdings/\n!/disclosures/docs/data/shards/npx/' ;;
            holdings) skip='!/disclosures/docs/data/shards/npx/' ;;
            *) skip='' ;;
          esac
          if [ -n "$skip" ]; then
            { echo 'sparse<<EOF'; echo '/*'; printf '%b\n' "$skip"; echo 'EOF'; echo 'filter=blob:none'; } >> "$GITHUB_OUTPUT"
          fi
          shown="${skip//$'\n'/ }"
          echo "::notice::module $module; the checkout leaves out: ${shown:-nothing}"
      - uses: actions/checkout@v6
        with:
          filter: ${{ steps.pick.outputs.filter }}
          sparse-checkout: ${{ steps.pick.outputs.sparse }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: disclosures/requirements.txt
      - name: Install PDF library
        run: python -m pip install -r requirements.txt
      - name: Install system OCR tools
        if: steps.pick.outputs.module == 'all' || steps.pick.outputs.module == 'congress'
        # 'congress' covers every officials' jurisdiction (US House, New York, California, Canada + imports)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Data and template checks
        # Full test suite is valuable on push/manual and the daily all-source run;
        # running it before every 15-minute disclosure poll delays freshness.
        if: github.event_name != 'schedule' || github.event.schedule == '43 10 * * *'
        run: |
          python -m unittest discover -s tests -v
          node --check docs/app.js
          node --check docs/extensions.js
          node --check docs/dashboard.js
          node tests/test_ui.js
      - name: Collect configured sources
        id: collect
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FDIC_API_KEY: ${{ secrets.FDIC_API_KEY }}
          CFTC_APP_TOKEN: ${{ secrets.CFTC_APP_TOKEN }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}           # optional: Reddit's OAuth API (else the public listing / ApeWisdom)
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          MODULE: ${{ steps.pick.outputs.module }}
          REVALIDATE: ${{ inputs.revalidate }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          MANAGER_CIK: ${{ inputs.manager_cik }}
          REPORT_ID: ${{ inputs.report_id }}
          BANK_CERT: ${{ inputs.bank_cert }}
          MARKET_ID: ${{ inputs.market_id }}
        shell: bash
        run: |
          module="$MODULE"
          args=(--only "$module")
          case "$module" in holdings|congress|all) args+=(--defer-enrichment) ;; esac
          if [ -n "$BATCH_SIZE" ]; then args+=(--batch-size "$BATCH_SIZE"); fi
          if [ -n "$MANAGER_CIK" ]; then args+=(--manager-cik "$MANAGER_CIK"); fi
          if [ -n "$REPORT_ID" ]; then args+=(--report-id "$REPORT_ID"); fi
          if [ -n "$BANK_CERT" ]; then args+=(--bank-cert "$BANK_CERT"); fi
          if [ -n "$MARKET_ID" ]; then args+=(--market-id "$MARKET_ID"); fi
          if [ "$REVALIDATE" = "true" ] || { [ "$module" = "all" ] && [ "$(date -u +%u)" = "7" ]; }; then
            args+=(--revalidate)
          fi
          python app/collect.py "${args[@]}"
      - name: Persist official snapshot and failure status
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        shell: bash
        run: python app/persist_snapshot.py
      - name: Preserve downloaded files and OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence-${{ github.run_id }}
          path: disclosures/storage/
          retention-days: 30
          if-no-files-found: ignore
      - name: Flag failed collection
        # app/collect.py exits 1 only when a source could not be read at all (an error annotation names it); partial
        # coverage — a batch cut short by a size or time limit, a few unreadable documents — is a warning annotation
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::error::A source failed (see the annotations). Previous valid records remain and were committed with status.'
          exit 1
