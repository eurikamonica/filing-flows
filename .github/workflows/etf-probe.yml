# TEMPORARY (removed before merge): samples for the ETF parsers, pushed to a scratch branch.
name: ETF probe
on:
  push:
    branches: [feature/etf-research]
    paths: [disclosures/app/etf_probe.py, .github/workflows/etf-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: disclosures/app
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python disclosures/app/etf_probe.py
      - name: Push the samples to a scratch branch
        if: always()
        run: |
          cd probe && find . -size +40M -delete && git init -q -b etf-probe-data && git add -A
          git -c user.name=probe -c user.email=actions@users.noreply.github.com commit -q -m probe
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" etf-probe-data
