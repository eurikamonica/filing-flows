# TEMPORARY (removed before merge): real samples for the debt parsers, pushed to a scratch branch.
name: Debt probe
on:
  push:
    branches: [feature/debt]
    paths: [disclosures/app/debt_probe.py, .github/workflows/debt-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            disclosures/app
            disclosures/config
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python disclosures/app/debt_probe.py probe
      - name: Push the samples to a scratch branch
        if: always()
        run: |
          cd probe && git init -q -b debt-probe-data && git add -A
          git -c user.name=probe -c user.email=actions@users.noreply.github.com commit -q -m probe
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" debt-probe-data
