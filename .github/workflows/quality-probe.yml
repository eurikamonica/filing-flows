name: Quality probe (temporary)
on:
  push:
    branches: [dev/quality-probe]
    paths: [probe/fetch.py, .github/workflows/quality-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python probe/fetch.py
      - run: |
          git config user.name "quality-probe"; git config user.email "probe@users.noreply.github.com"
          git add probe/facts && git commit -m "probe facts" && git push
