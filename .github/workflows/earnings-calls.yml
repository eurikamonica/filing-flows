name: Official IR + SEC earnings calls
on:
  workflow_dispatch:
  schedule:
    - cron: '31 */4 * * *'
  pull_request:
    paths:
      - 'disclosures/app/earnings_calls.py'
      - 'disclosures/app/earnings_call_intel.py'
      - 'disclosures/app/earnings_calls_phase2.py'
      - 'disclosures/config/earnings_calls.json'
      - 'disclosures/tests/test_earnings_calls.py'
      - 'disclosures/tests/test_earnings_call_intel.py'
      - 'disclosures/docs/earnings-calls.js'
      - 'web/flo-earnings-alerts.js'
      - 'web/mascot.js'
      - '.github/workflows/earnings-calls.yml'
permissions:
  contents: write
concurrency:
  group: earnings-calls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            disclosures/app
            disclosures/config
            disclosures/tests
            disclosures/docs/data/earnings-calls
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline scanner fixture checks
        run: PYTHONPATH=disclosures/app python -m unittest discover -s disclosures/tests -p 'test_earnings_calls.py' -v
      - name: Check Phase 2 parser fixtures
        run: PYTHONPATH=disclosures/app python -m unittest discover -s disclosures/tests -p 'test_earnings_call_intel.py' -v
      - name: Collect official evidence
        if: github.event_name != 'pull_request'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python disclosures/app/earnings_calls_phase2.py
      - name: Preserve raw official-source evidence (not public Pages)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: earnings-calls-evidence-${{ github.run_id }}
          path: disclosures/storage/earnings-calls/
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit public metadata index without overwriting other collectors
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add disclosures/docs/data/earnings-calls/index.json
          if git diff --cached --quiet; then
            echo 'No metadata changes'; exit 0
          fi
          git commit -m 'data: refresh official IR and SEC earnings evidence'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
