# Long history for the rotation charts (Disclosures → Rotation: the RRG in 2-D / 3-D / 4-D and the momentum clock since
# 2010). Weekly closes since 2000 for SPY, the sector and style ETFs and every company of the Sankey site, and the SEC
# XBRL frames back to 2009, are kept on the branch "rotation-history" (data only; the first run creates it). Each run
# fetches a batch of new tickers, refreshes the stalest ones, then rebuilds public/ (rrg.json, t/<TICKER>.json,
# rotation-long*.json), the next-step forecasts (chaos-forecast*.json, chaos-rrg.json; app/chaos_forecast.py) and their
# frozen track record (ledger/, forecast-ledger*.json; app/forecast_ledger.py); scan.yml
# publishes public/ with the hub on its next run. The branch keeps one commit (force-pushed)
# so history files never pile up. Run it by hand (Actions → Rotation history → Run workflow) to fetch tickers now.
name: Rotation history
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Fetch these first, in full (comma separated, e.g. NVDA, SMH)'
        default: ''
      batch:
        description: 'New tickers this run'
        default: '1000'
      refresh:
        description: 'Stale tickers to refresh this run (each a 6-month request)'
        default: '400'
      frames:
        description: 'Also collect the XBRL frames back to 2009'
        type: boolean
        default: true
      rebuild_only:
        description: 'Only rebuild public/ from what is on file'
        type: boolean
        default: false
  schedule:
    - cron: '41 */3 * * *'           # every three hours: a new batch, until every company is on file; then refreshes
permissions:
  contents: write
concurrency:
  group: rotation-history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            disclosures/app
            disclosures/config
            disclosures/docs/data/market/by-ticker-history.json
            disclosures/docs/data/market/by-ticker.json
            disclosures/docs/data/market/officials-trades.json
            disclosures/docs/data/market/options13f.json
            disclosures/docs/data/market/by-ticker-quarters.json
            disclosures/docs/data/cache/options/history.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: The history branch (created by the first run)
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" rotation-history >/dev/null; then
            git clone --quiet --depth 1 --branch rotation-history "$url" hist
          else
            mkdir hist && git -C hist init --quiet -b rotation-history && git -C hist remote add origin "$url"
          fi
          du -sh hist; ls hist
      - name: The Sankey site's companies (largest first)
        run: |
          site="${SITE_URL:-https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/}"
          mkdir -p site
          curl -fsSL --retry 4 --retry-delay 5 "${site%/}/data/index.json" -o site/index.json
          python -c "import json; d=json.load(open('site/index.json')); print(len(d.get('companies', [])), 'companies on the site')"
      - name: Weekly prices (new tickers first, then the stalest)
        if: ${{ !inputs.rebuild_only }}
        timeout-minutes: 30
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          python disclosures/app/rotation_history.py collect --root hist --site-index site/index.json \
            --batch "${{ inputs.batch || '1000' }}" --refresh "${{ inputs.refresh || '400' }}" --minutes 24 --tickers "$TICKERS"
      - name: XBRL frames back to 2009 (quarters on file are final)
        if: ${{ !inputs.rebuild_only && (github.event_name == 'schedule' || inputs.frames) }}
        continue-on-error: true
        timeout-minutes: 15
        run: python disclosures/app/rotation_history.py frames --root hist --quarters 76
      - name: Build public/ (RRG lines, ticker files, the long momentum clock)
        timeout-minutes: 12
        run: python disclosures/app/rotation_history.py build --root hist --site-data site --data disclosures/docs/data
      - name: Macro data (FRED, as published; public/macro.json)
        # Rates, curve, credit spread, VIX, dollar, oil, financial conditions, claims, payrolls, production, retail,
        # housing, sentiment, CPI / core / PCE, M2 — each placed at its publication date (app/macro_history.py).
        timeout-minutes: 6
        continue-on-error: true
        run: |
          python -m pip install --quiet numpy
          python disclosures/app/macro_history.py fetch --root hist
          python disclosures/app/macro_history.py build --root hist
      - name: Next-step forecasts and the galaxy (public/chaos-forecast*.json, chaos-rrg.json, galaxy.json)
        # Rotation → "Next step": arrows, cones and the price read from them. The weekly RRG walk-forward that scores the
        # RRG arrows is re-run on Saturdays (a few minutes); the other runs keep its last scores. A failure leaves the
        # previous forecast files in place and does not stop the history from being saved. The transition model now
        # also fits every industry's own line (industry_vs_market, about a minute more).
        timeout-minutes: 20
        continue-on-error: true
        run: |
          python -m pip install --quiet numpy pandas scikit-learn
          extra=""; [ "$(date -u +%u)" = "6" ] && extra="--rrg-backtest"
          python disclosures/app/chaos_forecast.py --public hist/public $extra
      - name: Forecast track record (ledger/*.json frozen forecasts; public/forecast-ledger*.json)
        # Each forecast is frozen the first time it is the newest one published and never edited; outcomes and gaps are
        # added once its period has closed. The ledger lives in hist/ledger and so survives the force-push.
        timeout-minutes: 5
        continue-on-error: true
        run: python disclosures/app/forecast_ledger.py --root hist --sha "$GITHUB_SHA"
      - name: Opportunity (direction, buy and short odds; public/opportunity-stocks*.json, ledger/opportunity-stocks.json)
        # For every stock: P(higher in 1 week / 1 month / 3 months), P(a buy makes money after costs), P(a short does, after
        # costs and the borrow fee), the return range, the edge over no signal and the signals behind it — one walk-forward
        # model per horizon on the weekly closes (app/opportunity.py, about two minutes). Each closed week's odds are frozen
        # in hist/ledger/opportunity-stocks.json and scored once known (public/opportunity-ledger-stocks.json).
        timeout-minutes: 20
        continue-on-error: true
        run: |
          python -m pip install --quiet numpy
          python disclosures/app/opportunity.py --public hist/public --ledger hist/ledger/opportunity-stocks.json --sha "$GITHUB_SHA"
      - name: Strategies (published rules with costs, overfitting tests, live ledger; public/strategies*.json, ledger/strategies.json)
        # Trend, momentum, mean reversion, seasonality, factors from the site's SEC and 13F data, pairs, sector rotation,
        # volatility targeting, risk parity and their ensemble, each as its paper published it, on the weekly closes since
        # 1995 (app/strategies.py, under a minute). Each closed week's positions are frozen in hist/ledger/strategies.json
        # and scored on the following weeks' prices (the live record).
        timeout-minutes: 10
        continue-on-error: true
        run: |
          python -m pip install --quiet numpy
          python disclosures/app/strategies.py --public hist/public --ledger hist/ledger/strategies.json \
            --quarters disclosures/docs/data/market/by-ticker-quarters.json --sha "$GITHUB_SHA"
      - name: Odds (probability models with their records; public/odds*.json, ledger/odds.json)
        # A US recession 12 months out from the yield curve (the New York Fed's probit), SPY's regime (a two-state hidden
        # Markov model), every stock's chance of a 10% / 20% move, of beating SPY, of joining the S&P 500 and of cutting its
        # dividend, and Merton's default odds from Debt & rates — each with its walk-forward calibration (app/odds.py,
        # about two minutes). The S&P 500 history and the distance to default are read from the published site.
        timeout-minutes: 12
        continue-on-error: true
        run: |
          python -m pip install --quiet numpy
          site="${SITE_URL:-https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/}"
          curl -fsSL --retry 3 "${site%/}/disclosures/data/etf/members.json" -o site/members.json || echo "::warning::no index membership file"
          curl -fsSL --retry 3 "${site%/}/disclosures/data/debt/index.json" -o site/debt-index.json || echo "::warning::no Debt & rates index"
          python disclosures/app/odds.py --public hist/public --root hist --members site/members.json --debt site/debt-index.json \
            --site-index site/index.json --ledger hist/ledger/odds.json --sha "$GITHUB_SHA"
      - name: Save to the branch (one commit, force-pushed)
        run: |
          cd hist
          printf '%s\n' '# rotation-history (data only)' '' \
            'Weekly closes since 2000 (cache/weekly), SEC XBRL frames back to 2009 (cache/frames), progress (state.json) and' \
            'the files the site publishes (public/), kept by .github/workflows/rotation-history.yml on main. Rebuilt and' \
            'force-pushed as a single commit on every run.' > README.md
          git add -A
          git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" commit -q -m "rotation history $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git checkout -q --orphan fresh
          git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" commit -q -m "rotation history $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q --force origin fresh:rotation-history && break; sleep $((i * 10)); done
          python -c "import json; s=json.load(open('state.json')).get('summary', {}); print(json.dumps(s))"
          python -c "import json; print(json.dumps(json.load(open('public/status.json'))))"
