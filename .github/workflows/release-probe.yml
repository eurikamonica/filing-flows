name: Release reader probe (temporary)
on:
  push:
    branches: [debug/release-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false
      - name: Build mrio.json
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          pip install -q openpyxl
          mkdir -p out dl
          curl -sSL -A "$SEC_USER_AGENT" "https://www.sec.gov/edgar/searchedgar/edgarstatecodes.htm" -o dl/edgar.html
          curl -sSL -o dl/adb.xlsx "https://kidb.adb.org/download/mrio-file/445" -w "adb %{http_code} %{size_download}\n"
          time python repo/scripts/mrio_build.py --adb dl/adb.xlsx --edgar dl/edgar.html --out out/mrio.json 2>&1 | tail -80 | tee out/build.log
          ls -la out
          echo "::notice::$(tail -4 out/build.log | tr '\n' ' ')"
      - name: Keep the files on a branch
        if: always()
        run: |
          cd out
          git init -q -b probe-release-data
          git add -A
          git -c user.name=probe -c user.email=actions@users.noreply.github.com commit -qm probe
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:probe-release-data
