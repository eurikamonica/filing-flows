# Copy this visible template into .github/workflows/update-and-deploy.yml
# using GitHub's Create new file editor (or automation/install-workflow.py + Git).
name: Collect disclosures and deploy
on:
  workflow_dispatch:
    inputs:
      module:
        description: Data module to update
        type: choice
        options: [all, holdings, congress, cot, banks, npx, markets]
        default: all
      batch_size:
        description: Optional entity/filer/PDF batch size (blank uses config)
        type: string
        default: ''
      manager_cik:
        description: Optional 13F or N-PX CIK (choose matching module)
        type: string
        default: ''
      report_id:
        description: Optional discovered House report ID (choose congress module)
        type: string
        default: ''
      bank_cert:
        description: Optional FDIC certificate (choose banks)
        type: string
        default: ''
      market_id:
        description: Optional dataset-code (choose cot)
        type: string
        default: ''
      revalidate:
        description: Re-download stored SEC / House documents
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '17 * * * *'
    - cron: '43 0-9,11-23 * * *'
    - cron: '43 10 * * *'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/**'
      - 'tests/**'
      - 'config/**'
      - 'imports/**'
      - 'requirements.txt'
      - '.github/workflows/update-and-deploy.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: disclosure-hub-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PDF library
        run: python -m pip install -r requirements.txt
      - name: Install system OCR tools
        if: github.event.schedule != '7,22,37,52 * * * *' && github.event.schedule != '43 0-9,11-23 * * *' && (inputs.module == '' || inputs.module == 'all' || inputs.module == 'congress')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Data and template checks
        run: |
          python -m unittest discover -s tests -v
          node --check docs/app.js
          node --check docs/extensions.js
          node --check docs/dashboard.js
          node tests/test_ui.js
      - name: Collect configured sources
        id: collect
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FDIC_API_KEY: ${{ secrets.FDIC_API_KEY }}
          CFTC_APP_TOKEN: ${{ secrets.CFTC_APP_TOKEN }}
          REQUESTED_MODULE: ${{ inputs.module }}
          REVALIDATE: ${{ inputs.revalidate }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          MANAGER_CIK: ${{ inputs.manager_cik }}
          REPORT_ID: ${{ inputs.report_id }}
          BANK_CERT: ${{ inputs.bank_cert }}
          MARKET_ID: ${{ inputs.market_id }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          module="${REQUESTED_MODULE:-all}"
          case "$EVENT_SCHEDULE" in
            '7,22,37,52 * * * *') module=holdings ;;
            '17 * * * *') module=congress ;;
            '43 0-9,11-23 * * *') module=markets ;;
            '43 10 * * *') module=all ;;
          esac
          args=(--only "$module")
          if [ -n "$BATCH_SIZE" ]; then args+=(--batch-size "$BATCH_SIZE"); fi
          if [ -n "$MANAGER_CIK" ]; then args+=(--manager-cik "$MANAGER_CIK"); fi
          if [ -n "$REPORT_ID" ]; then args+=(--report-id "$REPORT_ID"); fi
          if [ -n "$BANK_CERT" ]; then args+=(--bank-cert "$BANK_CERT"); fi
          if [ -n "$MARKET_ID" ]; then args+=(--market-id "$MARKET_ID"); fi
          if [ "$REVALIDATE" = "true" ] || { [ "$module" = "all" ] && [ "$(date -u +%u)" = "7" ]; }; then
            args+=(--revalidate)
          fi
          python app/collect.py "${args[@]}"
      - name: Persist official snapshot and failure status
        run: |
          git config user.name "Eurika"
          git config user.email "eurikamonica@gmail.com"
          git add docs/data/
          if ! git diff --cached --quiet; then
            git commit -m "Update disclosure data and source status"
            git push origin HEAD:main
          fi
      - name: Preserve downloaded files and OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence-${{ github.run_id }}
          path: storage/
          retention-days: 30
          if-no-files-found: ignore
      - name: Stage public website without collector caches
        run: |
          python - <<'PYCODE'
          import shutil
          shutil.copytree('docs', 'public-site', ignore=shutil.ignore_patterns('cache', 'discovery-state.json', 'npx-queue-state.json'))
          PYCODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
    outputs:
      collection_outcome: ${{ steps.collect.outcome }}
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard and source health
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Flag incomplete collection after publishing status
        if: needs.collect.outputs.collection_outcome == 'failure'
        run: |
          echo 'Some sources failed or coverage is partial. Previous valid records remain visible with status.'
          exit 1
