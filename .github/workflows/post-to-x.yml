name: Post to X

# The owner's "Post to X" buttons on a company page (send_requests kinds post / post_holders): draw the chart, have the
# model write one post from config/tweet-guide.md + the filing (or the Disclosures holders data), publish the images on
# the "media" branch and queue the post in Buffer. Separate from "Send requested reports" so it never waits behind
# reader e-mails.
#
# How it stays quick: GitHub runs cron schedules late and unevenly (a "*/5" schedule often fires every 20-40 minutes),
# so a run does not rely on cron. Each watch run keeps checking Supabase for ~4 minutes and, when it ends, starts the
# next watch run itself (workflow_dispatch with chained=true) — a continuous relay, one run at a time, with a button
# press picked up within about 20 seconds. The cron only restarts the relay if it ever breaks; the repository variable
# POST_WATCH=off stops it (runs then happen only on the cron / a Supabase wake / Run workflow).

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [post-request]
  workflow_dispatch:
    inputs:
      chained:
        description: "Started by the previous watch run (leave off when running by hand)"
        type: boolean
        default: false

permissions:
  contents: write      # the "media" branch holds the chart images Buffer loads
  models: read         # GitHub Models writes the post text (pipeline/tweet.py)
  actions: write       # starts the next watch run

concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  post:
    if: vars.SUPABASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      SITE_URL: ${{ vars.SITE_URL }}
      MEDIA_DIR: media
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TWEET_MODEL: ${{ vars.TWEET_MODEL }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Anything waiting?
        id: due
        env:
          # GitHub runs schedules at most every 5 minutes, so a scheduled run keeps watching for most of its slot
          # (one check every POLL_SECONDS, up to WATCH_SECONDS) — a button press is picked up within ~20 seconds.
          # A manual run or a Supabase wake (repository_dispatch) checks once; a relay run (schedule / chained) watches.
          WATCH_SECONDS: ${{ (github.event_name == 'schedule' || inputs.chained) && vars.POST_WATCH != 'off' && 240 || 0 }}
          POLL_SECONDS: 20
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          site="${SITE_URL:-https://$owner.github.io/${GITHUB_REPOSITORY#*/}/}"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          start=$(date +%s)
          while :; do
            rc=0; python -m pipeline.notify --site "$site" --requests --posts --due || rc=$?
            if [ $rc = 0 ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ $rc != 1 ]; then exit $rc; fi
            if [ $(( $(date +%s) - start )) -ge "$WATCH_SECONDS" ]; then break; fi
            sleep "$POLL_SECONDS"
          done
          echo "nothing waiting"; echo "go=no" >> "$GITHUB_OUTPUT"
      - name: Draw the chart and write the post
        if: steps.due.outputs.go == 'yes'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m pipeline.notify --site "${{ steps.due.outputs.site }}" --site-url "${{ steps.due.outputs.site }}" --requests --posts
      - name: Publish the images and queue the post in Buffer
        if: steps.due.outputs.go == 'yes'
        run: scripts/publish-media.sh
      - name: Start the next watch run
        if: always() && (github.event_name == 'schedule' || inputs.chained) && vars.POST_WATCH != 'off'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # one relay at a time: skip if another watch run is already queued or running
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow post-to-x.yml --status queued --json databaseId --jq length)
          m=$(gh run list -R "$GITHUB_REPOSITORY" --workflow post-to-x.yml --status in_progress --json databaseId --jq length)
          if [ "${n:-0}" -gt 0 ] || [ "${m:-0}" -gt 1 ]; then echo "another watch run is already waiting"; exit 0; fi
          gh workflow run post-to-x.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f chained=true
