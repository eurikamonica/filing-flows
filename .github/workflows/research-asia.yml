# Asia (company page → Customers, suppliers & model): customers and suppliers that companies listed in Japan, Taiwan,
# Korea and Hong Kong name in their annual reports, matched to US-listed companies (app/asia.py, app/asia_<market>.py).
# Every day: each market's new annual reports are listed and read, newest first; public/ is rebuilt. The first runs fill
# the cache (a year of reports; each run reads what fits in its minutes).
#
# Japan and Korea need free API keys, added as repository secrets (Settings → Secrets and variables → Actions):
#   EDINET_API_KEY  — https://api.edinet-fsa.go.jp/WEEE0090.aspx (APIキー発行: sign up with an email and phone number, then issue the key)
#   DART_API_KEY    — https://opendart.fss.or.kr (인증키 신청; optional: without it Korea is read from the public DART viewer, more slowly)
# Without EDINET_API_KEY Japan is skipped; Taiwan, Hong Kong (and Korea, more slowly) need no key.
# Kept on the branch "research-asia" (one commit, force-pushed); scan.yml publishes public/ at disclosures/data/research/asia/.
name: Research — Asia customers & suppliers
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes for reading reports'
        default: '45'
      markets:
        description: 'Markets (jp,kr,tw,hk)'
        default: 'jp,kr,tw,hk'
  schedule:
    - cron: '17 11 * * *'           # every day, 11:17 UTC
permissions:
  contents: write
concurrency:
  group: research-asia
  cancel-in-progress: false
jobs:
  asia:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: |
            /disclosures/app/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: pdftotext (Hong Kong and Taiwan reports are PDFs)
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: The data branch and the site's companies
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" research-asia >/dev/null; then
            git clone --quiet --depth 1 --branch research-asia "$url" asia
          else
            mkdir asia && git -C asia init --quiet -b research-asia && git -C asia remote add origin "$url"
          fi
          site="${SITE_URL:-https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/}"
          mkdir -p site && curl -fsSL --retry 4 --retry-delay 5 "${site%/}/data/index.json" -o site/index.json
      - name: Read annual reports
        id: collect
        timeout-minutes: 75
        run: python disclosures/app/asia.py collect --root asia --minutes "${{ inputs.minutes || '45' }}" --markets "${{ inputs.markets || 'jp,kr,tw,hk' }}"
      - name: Build public/
        if: always() && steps.collect.outcome != 'skipped'
        timeout-minutes: 10
        run: python disclosures/app/asia.py build --root asia --universe site/index.json
      - name: Save to the branch (one commit, force-pushed)
        if: always()
        run: |
          cd asia
          [ -d cache ] || exit 0
          printf '%s\n' '# research-asia (data only)' '' 'Customers and suppliers named in annual reports of companies listed in Japan, Taiwan, Korea and Hong Kong' \
            '(cache/<market>.json by report, cache/state.json the queue) and the files the site publishes (public/), kept by' \
            '.github/workflows/research-asia.yml on main.' > README.md
          git add -A
          git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" commit -q -m "asia $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git checkout -q --orphan fresh
          git -c user.name="filing-flows" -c user.email="actions@users.noreply.github.com" commit -q -m "asia $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q --force origin fresh:research-asia && break; sleep $((i * 10)); done
          [ -f public/status.json ] && python -c "import json; print('::notice::' + json.dumps(json.load(open('public/status.json')))[:900])" || true
