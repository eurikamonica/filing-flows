name: Release reader probe (temporary)
on:
  push:
    branches: [debug/release-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: OECD public API; EDGAR codes with the SEC user agent
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          mkdir -p out
          curl -sSL -A "$SEC_USER_AGENT" "https://www.sec.gov/edgar/searchedgar/edgarstatecodes.htm" -o out/edgar_codes.html -w "edgar %{http_code} %{size_download}\n" | tee out/sizes.txt
          curl -sSL --max-time 120 "https://sdmx.oecd.org/public/rest/dataflow/all/all/latest" -o out/oecd_flows.xml -w "oecd %{http_code} %{size_download}\n" | tee -a out/sizes.txt
          grep -oiE 'id="[^"]*(ICIO|IOTS|TIVA)[^"]*"[^>]*agencyID="[^"]*"' out/oecd_flows.xml | head -30 > out/oecd_icio_flows.txt || true
          grep -oiE '<structure:Dataflow[^>]*(ICIO|IOTS)[^>]*>' out/oecd_flows.xml | head -30 >> out/oecd_icio_flows.txt || true
          rm -f out/oecd_flows.xml
          echo "::notice::$(cat out/sizes.txt | tr '\n' ' ') flows: $(wc -l < out/oecd_icio_flows.txt)"
      - name: Keep the files on a branch
        if: always()
        run: |
          cd out
          git init -q -b probe-release-data
          git add -A
          git -c user.name=probe -c user.email=actions@users.noreply.github.com commit -qm probe
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:probe-release-data
