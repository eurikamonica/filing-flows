name: Site monitor

# Every half hour: is the site up and current, and (with your own server) is the server healthy? Problems are
# e-mailed to the owner with the daily report's MAIL_* secrets (scripts/site_monitor.py; deploy/README.md).
# Run it by hand with "compare" to check your own server against the site as served now, page by page
# (scripts/compare_hosts.py) — the test before the domain is switched.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      compare:
        description: "Also compare the site as served now with your own server, page by page"
        type: boolean
        default: false
      sample:
        description: "How many sitemap pages to compare"
        default: "300"

permissions:
  contents: read

concurrency:
  group: server-monitor
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://filing-flows.com' }}

jobs:
  check:
    if: vars.SITE_MONITOR != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/site_monitor.py
            /scripts/compare_hosts.py
            /pipeline/server_status.py
            /config/indexnow.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Own server's state (over SSH with the deploy key, when there is a server)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          python - <<'EOF'
          import json
          from pipeline import server_status
          s = server_status.fetch()
          if s is not None:
              json.dump(s, open("server.json", "w"))
              print({k: s.get(k) for k in ("web", "mode", "release", "published_at", "disk", "error")})
          else:
              print("no own server configured")
          EOF

      - name: The last run's state
        uses: actions/cache/restore@v4
        with:
          path: .monitor
          key: site-monitor-${{ github.run_id }}
          restore-keys: site-monitor-

      - name: Check the site
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/site_monitor.py --base "$SITE_URL" --server-status server.json --state .monitor/state.json

      - name: Keep the state for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor
          key: site-monitor-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compare the site as served now with your own server
        if: github.event_name == 'workflow_dispatch' && inputs.compare
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          [ -n "$DEPLOY_HOST" ] || { echo "::error::no DEPLOY_HOST secret: no server to compare"; exit 1; }
          python scripts/compare_hosts.py --old "$SITE_URL" --new-ip "$DEPLOY_HOST" --sample "${SAMPLE:-300}" --out compare-hosts.json

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.compare
        with:
          name: compare-hosts
          path: compare-hosts.json
          retention-days: 14
