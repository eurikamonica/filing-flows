# TEMPORARY (removed before merge): fetch the FRED series once on this branch and keep them as an artifact.
name: Macro probe
on:
  push:
    branches: [feature/macro-2010]
    paths: [disclosures/app/macro_history.py, .github/workflows/macro-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: disclosures/app
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reachability
        run: |
          for u in "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10" "https://api.stlouisfed.org/fred/series?series_id=DGS10"; do
            r=$(curl -sS -m 25 -o /tmp/o -w "%{http_code} %{time_total}s %{size_download}B" -A "Mozilla/5.0" "$u" 2>&1 | tr '\n' ' ')
            echo "::notice title=reach::$u -> $r $(head -c 120 /tmp/o 2>/dev/null | tr '\n' ' ')"
          done
          echo "::notice title=key::FRED_API_KEY set: $([ -n "$FRED_API_KEY" ] && echo yes || echo no)"
      - run: |
          python -m pip install --quiet numpy
          python disclosures/app/macro_history.py fetch --root hist
          python disclosures/app/macro_history.py build --root hist
          ls -la hist/cache/macro hist/public || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro
          path: hist
