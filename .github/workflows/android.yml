name: Android app

# Builds the Android app and publishes filing-flows.apk on the release page "android"
# (https://github.com/<you>/<repo>/releases/tag/android). Runs when anything under android/ changes, or by hand.

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write          # create / update the release

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key (optional, keeps updates installable)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a one-off key, so a later build installs only after uninstalling this one (see README)."
          fi

      - name: Test and build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          site="${SITE_URL:-https://$owner.github.io/${GITHUB_REPOSITORY#*/}/}"
          echo "The app opens $site"
          tasks="testDebugUnitTest assembleRelease"
          # Google Play takes an app bundle (.aab) signed with your own upload key
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then tasks="$tasks bundleRelease"; fi
          gradle --no-daemon -Pfilingflows.siteUrl="$site" $tasks
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/filing-flows.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/filing-flows.aab"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: filing-flows-apk
          path: filing-flows.apk

      - name: App bundle for Google Play (only with a signing key)
        if: env.ANDROID_KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: filing-flows-aab-for-google-play
          path: filing-flows.aab

      - name: Publish on the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Download filing-flows.apk on your Android phone (8.0 or newer), open it and allow installing from this source.
          Sign in with your e-mail inside the app, follow companies or sectors, and new charts arrive as notifications.
          Built from ${GITHUB_SHA::7}."
          gh release view android >/dev/null 2>&1 || gh release create android --title "Android app" --notes "$notes" --latest=false
          gh release edit android --notes "$notes"
          gh release upload android filing-flows.apk --clobber
