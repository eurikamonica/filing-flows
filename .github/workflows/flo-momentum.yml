name: Flo intraday five-minute momentum relay
on:
  schedule:
    - cron: '*/5 13-22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flo-minute-producer
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      FLO_MINUTE_FEED: ${{ vars.FLO_MINUTE_FEED || 'iex' }}
      FLO_MINUTE_PUBLIC_LICENSED: ${{ vars.FLO_MINUTE_PUBLIC_LICENSED || 'false' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/flo_momentum.py
            config/flo-market-universes/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check configuration
        shell: bash
        run: |
          if [[ -z "$ALPACA_API_KEY_ID" || -z "$ALPACA_API_SECRET_KEY" || -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_KEY" ]]; then
            echo "::notice::Flo minute producer not configured; no market prices published."
            exit 0
          fi
      - name: Validate Supabase 5m relation (fail with setup action)
        if: env.ALPACA_API_KEY_ID != '' && env.ALPACA_API_SECRET_KEY != '' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_KEY != ''
        run: python scripts/flo_momentum.py --check-store

      - name: Update 5-minute market momentum
        if: env.ALPACA_API_KEY_ID != '' && env.ALPACA_API_SECRET_KEY != '' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_KEY != ''
        run: python scripts/flo_momentum.py --once
