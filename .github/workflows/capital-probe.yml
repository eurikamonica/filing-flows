name: Capital probe (temporary)
on:
  push:
    branches: [dev/capital-probe]
    paths: [probe/fetch3.py, .github/workflows/capital-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - run: python probe/fetch3.py
      - run: |
          git config user.name "capital-probe"; git config user.email "probe@users.noreply.github.com"
          git add probe/facts3 && git commit -qm "probe facts" && git push
