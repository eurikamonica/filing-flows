name: Checks (offline)

# Offline gate for code changes: the earnings pipeline tests (fixtures stand in for SEC), JavaScript syntax of the
# site and the hub, and the hub's unit tests (its template tests need the data snapshot and run in disclosures.yml). No secrets, no network calls to SEC, X, mail or Buffer.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - 'supabase/**'
      - 'local-inference/**'   # Created by ChatGPT (OpenAI): CPU-only local companion checks.
      - 'disclosures/app/**'
      - 'disclosures/automation/**'
      - 'disclosures/tests/**'
      - 'disclosures/docs/*.js'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/workflows
            pipeline
            web
            scripts
            tests
            config
            supabase
            requirements.txt
            local-inference
            disclosures/app
            disclosures/automation
            disclosures/tests
            disclosures/config
            disclosures/docs
            !disclosures/docs/data
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Earnings pipeline tests (offline fixtures)
        env:
          SEC_USER_AGENT: 'Filing Flows CI ci@example.org'
        run: |
          pip install -r requirements.txt pytest playwright numpy    # numpy: the earnings-season research module
          sudo apt-get install -y -qq tesseract-ocr >/dev/null || echo "::warning::no Tesseract: the OCR end-to-end test is skipped"
          python -m playwright install chromium || echo "using the runner's Chrome"
          python -m pytest -q -rf tests > pytest.log 2>&1 || { grep -E "^(FAILED|ERROR) " pytest.log | head -30 | sed 's/^/::error::/'; tail -30 pytest.log; exit 1; }
          tail -3 pytest.log
      - name: Site JavaScript syntax and valuation math
        run: |
          for f in web/*.js web/beta/*.js; do node --check "$f"; done
          node tests/test_quality_ipo.cjs
          node tests/test_fsa.cjs
          node tests/test_posts_compose.cjs
          node tests/test_eps_research.cjs
          node --test tests/test_company_disclosures.cjs
          node --test tests/test_quality_visuals.cjs
          node tests/test_mascot.cjs
          node tests/test_flo_features.cjs
          node tests/test_guidance_view.cjs
          node tests/test_flo_layout.cjs
          node tests/test_flo_academy.cjs
          node tests/test_flo_workbook.cjs
          node tests/test_flo_real.cjs
          node tests/test_flo_coach.cjs
          node tests/test_flo_practice.cjs
          node tests/test_flo_alerts.cjs
          node tests/test_flo_timeline.cjs
          node tests/test_flo_momentum.cjs
          node tests/test_flo_impact.cjs
          node tests/test_flo_alert_browser.cjs
          node tests/test_flo_unified_dock.cjs
          node tests/test_actual_weights.cjs
          node tests/test_appearance.cjs
          node tests/test_video_income.cjs
          node tests/test_disclosed_weight_views.cjs
          node tests/test_studio.cjs
      - name: Hub unit and template tests
        working-directory: disclosures
        run: |
          python -m pip install --quiet numpy pandas scikit-learn    # chaos_forecast.py (its tests skip without them)
          python -m unittest discover -s tests
          node tests/test_freshness_ui.js
          node tests/test_opportunity_view.cjs
          node --check docs/freshness.js
          for f in docs/app.js docs/extensions.js docs/dashboard.js docs/market.js docs/rotation.js docs/options.js docs/xpost.js docs/rrg.js docs/chaos.js docs/galaxy.js docs/ledger.js docs/macro.js docs/debt-view.js docs/debt.js docs/consensus-view.js docs/posts.js docs/consensus.js docs/etf.js docs/smart.js docs/allflows.js docs/ownership.js docs/news.js docs/quality.js docs/quality-view.js docs/workforce.js docs/workforce-view.js docs/charts-view.js docs/fairvalue-view.js docs/markov-view.js docs/valuation.js docs/filings.js docs/filings-view.js docs/earnings.js docs/earnings-view.js docs/maps.js docs/events-view.js docs/people.js docs/people-view.js docs/opportunity.js docs/opportunity-view.js docs/outside-view.js docs/outside.js; do node --check "$f"; done
