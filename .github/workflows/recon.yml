name: recon (temporary)
on:
  push:
    branches: [recon-tmp]
  workflow_dispatch:
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python recon/recon.py
      - uses: actions/upload-artifact@v4
        with:
          name: recon-out
          path: recon-out/
