name: Release reader probe (temporary)
on:
  push:
    branches: [debug/release-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Structures
        run: |
          pip install -q playwright openpyxl && python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p out
          curl -sSIL "https://webfs-sti.oecd.org/files/STI-PIE/ICIO/2025/2016-2022_SML.zip" | grep -iE "content-length|HTTP/" > out/icio_head.txt
          curl -sSL -o readme.xlsx "https://webfs-sti.oecd.org/files/STI-PIE/ICIO/2025/ReadMe_ICIO_small.xlsx"
          python - <<'PY'
          import openpyxl, json
          wb = openpyxl.load_workbook("readme.xlsx", read_only=True)
          out = {}
          for ws in wb.worksheets:
              out[ws.title] = [[str(c) for c in r if c is not None][:8] for r in ws.iter_rows(values_only=True)][:120]
          json.dump(out, open("out/icio_readme.json", "w"), indent=0)
          PY
          B="https://ec.europa.eu/eurostat/api/dissemination"
          curl -sSL --max-time 120 "$B/sdmx/2.1/dataflow/ESTAT/naio_10_fcp_ii4/latest?references=descendants&detail=referencepartial" -o out/figaro_dsd.xml; echo "dsd $(wc -c < out/figaro_dsd.xml)"
          curl -sSL --max-time 120 "$B/sdmx/2.1/data/naio_10_fcp_ii4/?format=SDMX-CSV&startPeriod=2024&endPeriod=2024&lastNObservations=1" -o out/figaro_try_all.csv -w "all %{http_code} %{size_download}\n" | tee -a out/figaro_http.txt
          head -c 3000 out/figaro_try_all.csv > out/figaro_try_all_head.txt; rm -f out/figaro_try_all.csv
          python - <<'PY'
          import json, re
          from playwright.sync_api import sync_playwright
          pages = ["https://kidb.adb.org/globalization/current",
                   "https://circabc.europa.eu/ui/group/cec66924-a924-4f91-a0ef-600a0531e3ba/library/d333f912-0259-47cc-90e9-c12a41d902a0?p=1&n=50&sort=modified_DESC"]
          res = {}
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36")
              for u in pages:
                  try:
                      pg.goto(u, timeout=90000, wait_until="domcontentloaded")
                      pg.wait_for_timeout(10000)
                      links = pg.eval_on_selector_all("a", "els => els.map(e => [e.innerText.trim().slice(0,160), e.href])")
                      res[u] = {"links": links[:500], "text": pg.inner_text("body")[:8000]}
                  except Exception as e:
                      res[u] = {"error": str(e)[:300]}
              b.close()
          json.dump(res, open("out/links3.json", "w"), indent=1)
          PY
      - name: Keep the files on a branch
        if: always()
        run: |
          cd out
          git init -q -b probe-release-data
          git add -A
          git -c user.name=probe -c user.email=actions@users.noreply.github.com commit -qm probe
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:probe-release-data
